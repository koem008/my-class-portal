name: Apply Welcome Redesign
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/FirstWelcome.tsx'
      - '.github/workflows/apply-welcome-redesign.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Patch empty state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/index.tsx')
          s=p.read_text()
          anchor='import { ContextualDayLayer } from "@/components/ContextualDayLayer";'
          if 'FirstWelcome' not in s:
              s=s.replace(anchor, anchor+'\nimport { FirstWelcome } from "@/components/FirstWelcome";')
          start=s.index('  if (state === "empty")')
          end=s.index('  if (state === "error" || !briefing)', start)
          s=s[:start]+'  if (state === "empty") return <FirstWelcome />;\n'+s[end:]
          p.write_text(s)
          PY
      - name: Format and verify
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/components/FirstWelcome.tsx src/routes/index.tsx
          bun run lint
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/FirstWelcome.tsx src/routes/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: redesign first-run welcome experience'
          git push origin main
      - name: Remove one-shot workflow
        if: always()
        run: |
          git pull --rebase origin main || true
          git rm .github/workflows/apply-welcome-redesign.yml || true
          git commit -m 'chore: remove welcome redesign runner' || true
          git push origin main || true
