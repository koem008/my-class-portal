name: Finish Global Search

on:
  push:
    paths:
      - .github/workflows/finish-global-search.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bunx prettier --write src/lib/global-search-data.ts src/components/QuickNavigation.tsx

      - name: Companion policy tests
        run: bun test src/lib/ai/companion-policy.test.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/global-search-data.ts src/components/QuickNavigation.tsx src/routeTree.gen.ts
          git commit -m "feat: finish database global search"
          git push origin HEAD:main
