name: Apply Time Aware Start Page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-page-time-aware.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch start page
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/routes/index.tsx')
          s = p.read_text()

          s = s.replace('  Settings,\n  Sparkles,\n  Users,', '  Settings,\n  Sparkles,\n  Sunrise,\n  SunMedium,\n  Sunset,\n  MoonStar,\n  Users,')
          s = s.replace('  buildMorningMessage,\n  loadDailyBriefing,', '  buildTimeAwareGreeting,\n  loadDailyBriefing,')
          s = s.replace('  const now = useMemo(() => new Date(), []);', '''  const [now, setNow] = useState(() => new Date());\n  useEffect(() => {\n    const timer = window.setInterval(() => setNow(new Date()), 60_000);\n    return () => window.clearInterval(timer);\n  }, []);''')
          s = s.replace('  const message = buildMorningMessage(briefing);', '''  const greeting = buildTimeAwareGreeting(briefing, now);\n  const phaseMeta = {\n    morning: {\n      icon: Sunrise,\n      hero: "from-[#fffdf7] via-[#fff9e9] to-[#eaf7f0]",\n      badge: "bg-[#fff0c9] text-[#80621f]",\n      glow: "bg-[#ffe9a9]",\n    },\n    midday: {\n      icon: SunMedium,\n      hero: "from-white via-[#fffdf5] to-[#eef8f3]",\n      badge: "bg-[#e9f5ed] text-[#39706a]",\n      glow: "bg-[#dff2e8]",\n    },\n    afternoon: {\n      icon: Sunset,\n      hero: "from-[#fffdf9] via-[#fff4ea] to-[#f0edfb]",\n      badge: "bg-[#fff0e7] text-[#9a6449]",\n      glow: "bg-[#ffd9c2]",\n    },\n    evening: {\n      icon: MoonStar,\n      hero: "from-[#fffefa] via-[#f6f3fb] to-[#edf2f5]",\n      badge: "bg-[#eeeafa] text-[#665a92]",\n      glow: "bg-[#ddd5f4]",\n    },\n  }[greeting.phase];\n  const PhaseIcon = phaseMeta.icon;\n  const timeLabel = new Intl.DateTimeFormat("cs-CZ", { hour: "2-digit", minute: "2-digit" }).format(now);''')

          old = '''              <section className="rounded-[34px] border border-[#ebe5da] bg-gradient-to-br from-white via-[#fffdf8] to-[#eef8f3] p-6 shadow-[0_18px_60px_rgba(70,84,75,.08)] md:p-8">\n                <div className="inline-flex items-center gap-2 rounded-full bg-[#eaf6f0] px-3 py-1.5 text-[11px] font-bold uppercase tracking-[.15em] text-[#39706a]">\n                  <Sparkles className="h-3.5 w-3.5" />\n                  Dnešní přehled\n                </div>\n                <h1 className="mt-4 max-w-4xl text-3xl font-bold tracking-[-.035em] md:text-[38px]">\n                  {message}\n                </h1>\n                <p className="mt-3 text-sm leading-6 text-[#718183]">\n                  Tento přehled vznikl z databáze bez AI tokenů. Asistentka později pouze přidá\n                  přirozenější konverzaci a kreativní práci.\n                </p>\n              </section>'''
          new = '''              <section className={`relative overflow-hidden rounded-[34px] border border-[#ebe5da] bg-gradient-to-br ${phaseMeta.hero} p-6 shadow-[0_18px_60px_rgba(70,84,75,.08)] md:p-8`}>\n                <div className={`pointer-events-none absolute -right-12 -top-16 h-44 w-44 rounded-full ${phaseMeta.glow} opacity-45 blur-3xl`} />\n                <div className="relative">\n                  <div className="flex flex-wrap items-center gap-2">\n                    <div className={`inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-[11px] font-bold uppercase tracking-[.15em] ${phaseMeta.badge}`}>\n                      <PhaseIcon className="h-3.5 w-3.5" />\n                      {greeting.eyebrow}\n                    </div>\n                    <span className="rounded-full bg-white/65 px-3 py-1.5 text-[11px] font-semibold text-[#7b8987] backdrop-blur">\n                      {timeLabel} · právě teď\n                    </span>\n                  </div>\n                  <h1 className="mt-4 max-w-5xl text-3xl font-bold tracking-[-.04em] md:text-[40px] md:leading-[1.08]">\n                    {greeting.headline}\n                  </h1>\n                  <p className="mt-4 max-w-4xl text-sm leading-6 text-[#667a7b] md:text-[15px]">\n                    {greeting.supportingText}\n                  </p>\n                  <div className="mt-5 flex flex-wrap gap-2">\n                    <Link\n                      to="/asistentka"\n                      className="inline-flex items-center gap-2 rounded-2xl bg-[#276765] px-4 py-2.5 text-xs font-bold text-white shadow-sm transition hover:-translate-y-0.5"\n                    >\n                      <Mic className="h-4 w-4" />\n                      Probrat to s asistentkou\n                    </Link>\n                    <Link\n                      to="/rozvrh"\n                      className="inline-flex items-center gap-2 rounded-2xl border border-white/80 bg-white/70 px-4 py-2.5 text-xs font-bold text-[#526866] backdrop-blur transition hover:bg-white"\n                    >\n                      Dnešní rozvrh <ChevronRight className="h-4 w-4" />\n                    </Link>\n                  </div>\n                </div>\n              </section>'''
          if old not in s:
              raise SystemExit('hero marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format
        run: bunx prettier --write src/routes/index.tsx src/lib/daily-briefing-data.ts src/lib/ai/contracts.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit verified change and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/start-page-time-aware.yml
          git add src/routes/index.tsx src/lib/daily-briefing-data.ts src/lib/ai/contracts.ts
          git commit -m "feat: make start page react warmly to time of day"
          git push origin main
