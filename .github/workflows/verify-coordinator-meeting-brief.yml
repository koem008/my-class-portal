name: Verify Coordinator Meeting Brief
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-meeting-brief.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire deterministic meeting brief
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/components/assistant-coordinator/CoordinatorMeetingBriefCard.tsx')
          s=p.read_text()
          s=s.replace('import { useMemo, useState } from "react";', 'import { useMemo, useState, type ReactNode } from "react";')
          s=s.replace('children: React.ReactNode;', 'children: ReactNode;')
          p.write_text(s)

          p=Path('src/routes/asistenti.tsx')
          s=p.read_text()
          marker='import { CoordinatorItemsCard } from "@/components/assistant-coordinator/CoordinatorItemsCard";\n'
          addition='import { CoordinatorMeetingBriefCard } from "@/components/assistant-coordinator/CoordinatorMeetingBriefCard";\n'
          if 'CoordinatorMeetingBriefCard' not in s:
            if marker not in s: raise SystemExit('import marker missing')
            s=s.replace(marker,marker+addition,1)
          old='''        <CoordinatorItemsCard\n          schoolId={context.access.schoolId}\n          assistants={assistants}\n          classes={classes}\n          onOpenItemsChange={setCoordinationItems}\n        />'''
          new=old+'''\n\n        <CoordinatorMeetingBriefCard items={coordinationItems} exceptions={exceptions} />'''
          if '<CoordinatorMeetingBriefCard items=' not in s:
            if old not in s: raise SystemExit('render marker missing')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/components/assistant-coordinator/CoordinatorMeetingBriefCard.tsx src/routes/asistenti.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/assistant-coordinator/CoordinatorMeetingBriefCard.tsx src/routes/asistenti.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: surface deterministic coordinator meeting brief"
            git push origin main
          fi
