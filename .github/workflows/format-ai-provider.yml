name: Format AI Provider

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format provider
        run: bunx prettier --write src/lib/ai/provider.server.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src/lib/ai/provider.server.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/provider.server.ts
          git commit -m "style: format external AI provider adapters"
          git push origin HEAD:main
