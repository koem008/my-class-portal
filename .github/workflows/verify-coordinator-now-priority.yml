name: Verify Coordinator Now Priority
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-now-priority.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Merge due follow-ups into deterministic now card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/lib/assistant-coordinator-data.ts')
          s=p.read_text()
          if 'export type CoordinatorPriorityItem' not in s:
            marker='export type CoordinatorNowCard = {\n'
            if marker not in s: raise SystemExit('priority type marker missing')
            s=s.replace(marker,'''export type CoordinatorPriorityItem = {\n  status: "open" | "done";\n  title: string;\n  due_on: string | null;\n  kind: "note" | "task" | "follow_up";\n  assistantName?: string | null;\n  className?: string | null;\n};\n\n'''+marker,1)
          old='''export function buildCoordinatorNowCard(\n  now: Date,\n  workSlots: AssistantWorkSlot[],\n  exceptions: AssistantPresenceException[],\n): CoordinatorNowCard {'''
          new='''export function buildCoordinatorNowCard(\n  now: Date,\n  workSlots: AssistantWorkSlot[],\n  exceptions: AssistantPresenceException[],\n  items: CoordinatorPriorityItem[] = [],\n): CoordinatorNowCard {'''
          if old in s: s=s.replace(old,new,1)
          elif 'items: CoordinatorPriorityItem[] = []' not in s: raise SystemExit('now signature missing')
          if 'const openDueItems = items' not in s:
            marker='  const changed = todayExceptions.find((row) => row.kind === "changed");\n'
            if marker not in s: raise SystemExit('changed marker missing')
            block='''  const openDueItems = items\n    .filter((item) => item.status === "open" && item.due_on)\n    .sort((a, b) => (a.due_on ?? "").localeCompare(b.due_on ?? ""));\n  const overdue = openDueItems.find((item) => (item.due_on ?? "") < today);\n  if (overdue) {\n    const context = [overdue.assistantName, overdue.className].filter(Boolean).join(" · ");\n    return {\n      tone: "attention",\n      eyebrow: "Co dnes řeším?",\n      title: `Po termínu: ${overdue.title}`,\n      detail: context ? `${context} · Otevři rozdělané a navazuj.` : "Otevři rozdělané a navazuj.",\n    };\n  }\n\n  const dueToday = openDueItems.find((item) => item.due_on === today);\n  if (dueToday) {\n    const context = [dueToday.assistantName, dueToday.className].filter(Boolean).join(" · ");\n    return {\n      tone: "next",\n      eyebrow: "Co dnes řeším?",\n      title: `Dnes: ${dueToday.title}`,\n      detail: context || "Je to dnešní otevřený follow-up.",\n    };\n  }\n\n'''
            s=s.replace(marker,block+marker,1)
          p.write_text(s)

          p=Path('src/components/assistant-coordinator/CoordinatorItemsCard.tsx')
          s=p.read_text()
          if 'onOpenItemsChange?:' not in s:
            s=s.replace('''  classes,\n}: {\n  schoolId: string;\n  assistants: TeachingAssistant[];\n  classes: CoordinatorClass[];\n}) {''','''  classes,\n  onOpenItemsChange,\n}: {\n  schoolId: string;\n  assistants: TeachingAssistant[];\n  classes: CoordinatorClass[];\n  onOpenItemsChange?: (items: AssistantCoordinationItem[]) => void;\n}) {''',1)
          if 'onOpenItemsChange?.(' not in s:
            old='      setItems(await loadAssistantCoordinationItems(schoolId, assistants, classes));'
            if old not in s: raise SystemExit('items load marker missing')
            s=s.replace(old,'''      const rows = await loadAssistantCoordinationItems(schoolId, assistants, classes);\n      setItems(rows);\n      onOpenItemsChange?.(rows.filter((item) => item.status === "open"));''',1)
          s=s.replace('  }, [schoolId, assistants, classes]);','  }, [schoolId, assistants, classes, onOpenItemsChange]);',1)
          p.write_text(s)

          p=Path('src/routes/asistenti.tsx')
          s=p.read_text()
          import_marker='import { CoordinatorItemsCard } from "@/components/assistant-coordinator/CoordinatorItemsCard";\n'
          if 'type AssistantCoordinationItem' not in s:
            if import_marker not in s: raise SystemExit('route import marker missing')
            s=s.replace(import_marker,import_marker+'import type { AssistantCoordinationItem } from "@/lib/assistant-coordinator-items";\n',1)
          if 'coordinationItems' not in s:
            marker='  const [aliases, setAliases] = useState<CoordinatorAliasOption[]>([]);\n'
            if marker not in s: raise SystemExit('route state marker missing')
            s=s.replace(marker,marker+'  const [coordinationItems, setCoordinationItems] = useState<AssistantCoordinationItem[]>([]);\n',1)
          old='''  const nowCard = useMemo(\n    () => buildCoordinatorNowCard(now, workSlots, exceptions),\n    [now, workSlots, exceptions],\n  );'''
          new='''  const nowCard = useMemo(\n    () => buildCoordinatorNowCard(now, workSlots, exceptions, coordinationItems),\n    [now, workSlots, exceptions, coordinationItems],\n  );'''
          if old in s: s=s.replace(old,new,1)
          elif 'buildCoordinatorNowCard(now, workSlots, exceptions, coordinationItems)' not in s: raise SystemExit('route now card marker missing')
          old='''        <CoordinatorItemsCard\n          schoolId={context.access.schoolId}\n          assistants={assistants}\n          classes={classes}\n        />'''
          new='''        <CoordinatorItemsCard\n          schoolId={context.access.schoolId}\n          assistants={assistants}\n          classes={classes}\n          onOpenItemsChange={setCoordinationItems}\n        />'''
          if old in s: s=s.replace(old,new,1)
          elif 'onOpenItemsChange={setCoordinationItems}' not in s: raise SystemExit('route component marker missing')
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/assistant-coordinator-data.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/routes/asistenti.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified priority integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/assistant-coordinator-data.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/routes/asistenti.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: include coordinator follow-ups in now card"
            git push origin main
          fi
