name: Connect AI UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch teacher AI flows
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"marker missing: {label}")
              return text.replace(old, new, 1)

          p = Path('src/routes/hodina.$lessonId.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { useEffect, useMemo, useState } from "react";\n', 'import { useEffect, useMemo, useState } from "react";\nimport { runLessonAi } from "@/lib/ai/functions";\nimport type { LessonAiAction } from "@/lib/ai/contracts";\n', 'lesson imports')
          s = replace_once(s, 'const signalLabels: Record<LearningSignalKind, string> = {\n  needs_practice: "Potřebuje procvičit",\n  improving: "Zlepšuje se",\n  mastered: "Zvládnuto",\n  advanced: "Je napřed",\n  follow_up: "Vrátit se k tématu",\n};\n', 'const signalLabels: Record<LearningSignalKind, string> = {\n  needs_practice: "Potřebuje procvičit",\n  improving: "Zlepšuje se",\n  mastered: "Zvládnuto",\n  advanced: "Je napřed",\n  follow_up: "Vrátit se k tématu",\n};\nconst aiActionLabels: Record<LessonAiAction, string> = {\n  lesson_plan: "Kompletní příprava",\n  board_notes: "Zápis na tabuli",\n  worksheet: "Pracovní list",\n  answer_key: "Klíč správných odpovědí",\n  quiz: "Kvíz",\n  presentation_outline: "Osnova prezentace",\n  activity: "Aktivita do hodiny",\n  differentiation: "Diferenciace",\n  homework: "Domácí úkol",\n};\n', 'lesson action labels')
          s = replace_once(s, '  const [signalNote, setSignalNote] = useState("");\n', '  const [signalNote, setSignalNote] = useState("");\n  const [aiAction, setAiAction] = useState<LessonAiAction>("lesson_plan");\n  const [aiInstruction, setAiInstruction] = useState("");\n  const [aiGenerating, setAiGenerating] = useState(false);\n', 'lesson states')
          marker = '  if (loadState === "loading")\n'
          fn = '''  async function handleAiGenerate() {\n    if (!lesson) return;\n    setAiGenerating(true);\n    setNotice("");\n    try {\n      const outcomeCodes = (curriculum?.outcomes ?? []).map((item) => item.official_code).filter((code): code is string => Boolean(code));\n      const result = await runLessonAi({ data: { action: aiAction, context: { lessonId: lesson.id, grade: curriculum?.classGrade ?? 5, subject: lesson.subject_name, topic: lesson.topic ?? lesson.title ?? undefined, durationMinutes: 45, curriculumOutcomeCodes: outcomeCodes, curriculumSummary: (curriculum?.outcomes ?? []).map((item) => [item.official_code, item.title, item.description].filter(Boolean).join(" · ")).join("\\n") || undefined, previousLessonSummary: continuity.map((item) => `${item.title}: ${item.detail}`).join("\\n") || undefined, teacherInstruction: aiInstruction.trim() || undefined } } });\n      const kind = aiAction === "presentation_outline" ? "presentation" : aiAction;\n      setMaterialKind(kind as MaterialKind);\n      setMaterialTitle(result.title);\n      setMaterialText(JSON.stringify(result.content, null, 2));\n      setNotice("AI připravila editovatelný koncept. Nic se neuložilo — obsah zkontrolujte a potvrďte ručně.");\n    } catch (error) {\n      setNotice(error instanceof Error ? error.message : "AI zatím není připojena.");\n    } finally { setAiGenerating(false); }\n  }\n\n'''
          s = replace_once(s, marker, fn + marker, 'lesson ai function')
          old_panel = '''            <Panel\n              title="AI asistentka hodiny"\n              subtitle="Provider zatím není připojený. Žádný obsah se neposílá třetí straně."\n              icon={<Sparkles className="h-5 w-5" />}\n            >\n              <div className="rounded-2xl bg-gradient-to-br from-[#eef8f3] to-[#fff8ed] p-4">\n                <p className="text-sm leading-6 text-[#617474]">\n                  Až doplníme serverový API klíč, AI dostane jen kontext této hodiny, relevantní\n                  ověřené kurikulum, reflexi a pseudonymní pedagogické signály. Ne skutečné\n                  identity.\n                </p>\n                <button\n                  disabled\n                  className="mt-4 inline-flex items-center gap-2 rounded-2xl bg-[#dfe9e5] px-4 py-2.5 text-sm font-bold text-[#78908b]"\n                >\n                  <Mic className="h-4 w-4" />\n                  AI zatím není připojena\n                </button>\n              </div>\n            </Panel>'''
          new_panel = '''            <Panel\n              title="AI asistentka hodiny"\n              subtitle="Claude připraví návrh z kontextu hodiny a ověřeného kurikula. Nikdy ho sám neuloží."\n              icon={<Sparkles className="h-5 w-5" />}\n            >\n              <div className="rounded-2xl bg-gradient-to-br from-[#eef8f3] to-[#fff8ed] p-4">\n                <p className="text-sm leading-6 text-[#617474]">Vyberte výstup a případně doplňte instrukci. Výsledek se vloží jen do editovatelného konceptu v sekci Materiály.</p>\n                <select value={aiAction} onChange={(event) => setAiAction(event.target.value as LessonAiAction)} className="mt-4 w-full rounded-2xl border border-[#dbe7e2] bg-white px-3 py-2.5 text-sm">\n                  {Object.entries(aiActionLabels).map(([value, label]) => (<option key={value} value={value}>{label}</option>))}\n                </select>\n                <textarea value={aiInstruction} onChange={(event) => setAiInstruction(event.target.value)} placeholder="Volitelně: více pohybu, práce ve dvojicích, jednodušší varianta…" className="mt-3 min-h-24 w-full rounded-2xl border border-[#dbe7e2] bg-white px-3 py-3 text-sm" />\n                <button onClick={() => void handleAiGenerate()} disabled={aiGenerating} className="mt-3 inline-flex items-center gap-2 rounded-2xl bg-[#276765] px-4 py-2.5 text-sm font-bold text-white disabled:opacity-50">\n                  {aiGenerating ? <Loader2 className="h-4 w-4 animate-spin" /> : <Sparkles className="h-4 w-4" />}\n                  {aiGenerating ? "Připravuji…" : "Vytvořit návrh"}\n                </button>\n              </div>\n            </Panel>'''
          s = replace_once(s, old_panel, new_panel, 'lesson ai panel')
          p.write_text(s)

          p = Path('src/routes/hlas.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { CheckCircle2, ChevronLeft, Loader2, Mic, MicOff, Save, ShieldCheck } from "lucide-react";\n', 'import { CheckCircle2, ChevronLeft, Loader2, Mic, MicOff, Save, ShieldCheck, Volume2 } from "lucide-react";\n', 'voice icon')
          s = replace_once(s, 'import { transcribeVoice } from "@/lib/ai/functions";\n', 'import { runLessonAi, synthesizeAssistantVoice, transcribeVoice } from "@/lib/ai/functions";\n', 'voice imports')
          s = replace_once(s, '  const [notice, setNotice] = useState("");\n', '  const [notice, setNotice] = useState("");\n  const [speaking, setSpeaking] = useState(false);\n', 'voice state')
          marker = '  async function save() {\n'
          voice_fn = '''  async function speakAiResponse() {\n    if (!selectedLesson || !transcript.trim()) return;\n    setSpeaking(true);\n    setNotice("");\n    try {\n      const workspace = await loadLessonWorkspace(selectedLesson.id);\n      const outcomeCodes = (workspace.curriculum?.outcomes ?? []).map((item) => item.official_code).filter((code): code is string => Boolean(code));\n      const ai = await runLessonAi({ data: { action: "activity", context: { lessonId: selectedLesson.id, grade: workspace.curriculum?.classGrade ?? 5, subject: selectedLesson.subject_name, topic: selectedLesson.topic ?? selectedLesson.title ?? undefined, durationMinutes: 45, curriculumOutcomeCodes: outcomeCodes, curriculumSummary: (workspace.curriculum?.outcomes ?? []).map((item) => [item.official_code, item.title].filter(Boolean).join(" · ")).join("\\n") || undefined, teacherInstruction: `Učitel nadiktoval tuto stručnou reflexi: ${transcript.trim()}\\nOdpověz česky velmi stručně a prakticky: co si z hodiny odnést a jak začít příště. Nepřidávej žádná jména ani osobní údaje.` } } });\n      const spoken = [ai.title, ...extractSpokenText(ai.content)].join(". ").slice(0, 1800);\n      if (!spoken.trim()) throw new Error("AI nevytvořila text vhodný k přečtení.");\n      const voice = await synthesizeAssistantVoice({ data: { text: spoken } });\n      const player = new Audio(`data:${voice.mimeType};base64,${voice.audioBase64}`);\n      await player.play();\n      setNotice("AI odpověď se přehrává. Nic z odpovědi se samo neukládá.");\n    } catch (error) {\n      setNotice(error instanceof Error ? error.message : "Hlas zatím není připojen.");\n    } finally { setSpeaking(false); }\n  }\n\n'''
          s = replace_once(s, marker, voice_fn + marker, 'voice ai function')
          old = '''              <div className="mt-3 flex justify-end">\n                <button\n                  type="button"\n                  onClick={structureCurrentTranscript}\n                  disabled={!transcript.trim()}\n                  className="rounded-2xl bg-[#eef6f2] px-4 py-2.5 text-sm font-bold text-[#276765] disabled:opacity-40"\n                >\n                  Rozdělit přepis bez AI\n                </button>\n              </div>'''
          new = '''              <div className="mt-3 flex flex-wrap justify-end gap-2">\n                <button type="button" onClick={structureCurrentTranscript} disabled={!transcript.trim()} className="rounded-2xl bg-[#eef6f2] px-4 py-2.5 text-sm font-bold text-[#276765] disabled:opacity-40">Rozdělit přepis bez AI</button>\n                <button type="button" onClick={() => void speakAiResponse()} disabled={!transcript.trim() || speaking} className="inline-flex items-center gap-2 rounded-2xl bg-[#276765] px-4 py-2.5 text-sm font-bold text-white disabled:opacity-40">\n                  {speaking ? <Loader2 className="h-4 w-4 animate-spin" /> : <Volume2 className="h-4 w-4" />}\n                  {speaking ? "Připravuji odpověď…" : "Odpovědět hlasem"}\n                </button>\n              </div>\n              <p className="mt-2 text-right text-[11px] leading-4 text-[#8a9695]">Do hlasové AI zadávejte pouze pseudonymy, ne skutečná jména žáků.</p>'''
          s = replace_once(s, old, new, 'voice buttons')
          helper_marker = '\nfunction structureTranscript(value: string): StructuredReflection {'
          helper = '''\nfunction extractSpokenText(value: unknown): string[] {\n  if (typeof value === "string") return value.trim() ? [value.trim()] : [];\n  if (typeof value === "number" || typeof value === "boolean") return [String(value)];\n  if (Array.isArray(value)) return value.flatMap(extractSpokenText);\n  if (value && typeof value === "object") return Object.values(value as Record<string, unknown>).flatMap(extractSpokenText);\n  return [];\n}\n'''
          s = replace_once(s, helper_marker, helper + helper_marker, 'voice helper')
          p.write_text(s)

          p = Path('src/routes/vytvarna-vychova.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { useEffect, useState } from "react";\n', 'import { useEffect, useState } from "react";\nimport { generateArtInspirationImage } from "@/lib/ai/functions";\n', 'art import')
          s = replace_once(s, '  const [error, setError] = useState("");\n', '  const [error, setError] = useState("");\n  const [imageGenerating, setImageGenerating] = useState(false);\n  const [imageResult, setImageResult] = useState<{ imageBase64: string; mimeType: string } | null>(null);\n', 'art states')
          marker = '  async function applyTheme(theme: ArtTheme) {\n'
          art_fn = '''  async function generateInspiration(theme: ArtTheme) {\n    setImageGenerating(true); setError("");\n    try {\n      const result = await generateArtInspirationImage({ data: { grade: 5, topic: theme.title, purpose: theme.summary, curriculumOutcomeCodes: theme.outcome_codes, style: "friendly_illustration", aspectRatio: "4:3" } });\n      setImageResult({ imageBase64: result.imageBase64, mimeType: result.mimeType });\n    } catch (e: any) { setError(e?.message ?? "Obrázková AI zatím není připojena."); } finally { setImageGenerating(false); }\n  }\n\n'''
          s = replace_once(s, marker, art_fn + marker, 'art generate function')
          s = replace_once(s, '                    onApply={() => void applyTheme(selected)}\n', '                    onApply={() => void applyTheme(selected)}\n                    onGenerateImage={() => void generateInspiration(selected)}\n                    imageGenerating={imageGenerating}\n                    imageResult={imageResult}\n', 'art props call')
          s = replace_once(s, '  onApply,\n}: {\n  theme: ArtTheme;\n  outcomes: any[];\n  saving: boolean;\n  onApply: () => void;\n}) {\n', '  onApply,\n  onGenerateImage,\n  imageGenerating,\n  imageResult,\n}: {\n  theme: ArtTheme;\n  outcomes: any[];\n  saving: boolean;\n  onApply: () => void;\n  onGenerateImage: () => void;\n  imageGenerating: boolean;\n  imageResult: { imageBase64: string; mimeType: string } | null;\n}) {\n', 'art props definition')
          detail_marker = '      <div className="mt-5 space-y-5">\n'
          image_ui = '''      <div className="mt-5 rounded-2xl border border-violet-100 bg-violet-50/50 p-4">\n        <div className="flex flex-wrap items-center justify-between gap-3">\n          <div><div className="text-sm font-semibold">AI inspirační obrázek</div><div className="mt-1 text-xs text-slate-500">Pouze jednoduchá školní ilustrace, bez fotorealistických osob a bez identity dětí.</div></div>\n          <button type="button" onClick={onGenerateImage} disabled={imageGenerating} className="inline-flex items-center gap-2 rounded-xl bg-violet-700 px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50"><Sparkles className="h-4 w-4" />{imageGenerating ? "Generuji…" : "Vytvořit inspiraci"}</button>\n        </div>\n        {imageResult && (<img src={`data:${imageResult.mimeType};base64,${imageResult.imageBase64}`} alt={`AI inspirační ilustrace k tématu ${theme.title}`} className="mt-4 w-full rounded-2xl border border-white object-cover shadow-sm" />)}\n      </div>\n'''
          s = replace_once(s, detail_marker, image_ui + detail_marker, 'art image ui')
          p.write_text(s)

          Path('.github/workflows/connect-ai-ui.yml').unlink()
      - name: Format and verify
        run: |
          corepack enable
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
            bunx prettier --write 'src/routes/hodina.$lessonId.tsx' src/routes/hlas.tsx src/routes/vytvarna-vychova.tsx
            bun run typecheck || true
          else
            npm ci
            npx prettier --write 'src/routes/hodina.$lessonId.tsx' src/routes/hlas.tsx src/routes/vytvarna-vychova.tsx
            npm run typecheck --if-present
          fi
      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect AI providers to teacher workflows"
          git push origin HEAD:main
