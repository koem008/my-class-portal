name: General Voice Companion Retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reuse companion patch and fix parser boundary
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          wf = Path('.github/workflows/companion-voice-control.yml').read_text()
          start = wf.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = wf.index("\n          PY", start)
          code = textwrap.dedent(wf[start:end])
          exec(compile(code, '<companion-patch>', 'exec'))
          p = Path('src/lib/ai/provider.server.ts')
          s = p.read_text()
          s = s.replace('  let parsed: any;\n', '  // JSON.parse is the untyped provider boundary; fields are validated immediately below.\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any\n  let parsed: any;\n', 1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/ai/contracts.ts src/lib/ai/provider.server.ts src/lib/ai/functions.ts src/routes/asistentka.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit
        run: |
          rm -f .github/workflows/companion-voice-control.yml .github/workflows/companion-voice-control-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/contracts.ts src/lib/ai/provider.server.ts src/lib/ai/functions.ts src/routes/asistentka.tsx .github/workflows/companion-voice-control.yml .github/workflows/companion-voice-control-retry.yml
          git commit -m "feat: add general voice companion and safe app navigation"
          git push
