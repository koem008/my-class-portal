name: Finish Calendar Blocking Flow

on:
  push:
    paths:
      - .github/workflows/finish-calendar-blocking-flow.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply calendar blocking UI patch
        run: python scripts/finish_calendar_blocking_flow.py

      - name: Guard explicit move semantics
        shell: bash
        run: |
          grep -q 'reconcile_blocking_calendar_event' src/lib/calendar-data.ts
          grep -q 'rescheduleMovedLesson' src/lib/calendar-data.ts
          grep -q 'Čeká na přesun' src/routes/kalendar.tsx
          grep -q 'Nic nebylo označeno jako odučené' src/routes/kalendar.tsx

      - name: Format
        run: bunx prettier --write src/lib/calendar-data.ts src/routes/kalendar.tsx

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/calendar-data.ts src/routes/kalendar.tsx
          git commit -m "feat: complete blocking calendar lesson flow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
