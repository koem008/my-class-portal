name: Format voice route

on:
  push:
    branches:
      - feature/e2e-lesson-workflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/e2e-lesson-workflow

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format voice route
        run: bunx prettier --write src/routes/hlas.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/routes/hlas.tsx; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/hlas.tsx
          git commit -m "style: format voice reflection route"
          git push origin HEAD:feature/e2e-lesson-workflow
