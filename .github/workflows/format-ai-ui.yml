name: Format AI UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write 'src/routes/hodina.$lessonId.tsx' src/routes/hlas.tsx src/routes/vytvarna-vychova.tsx
      - run: |
          rm -f .github/workflows/format-ai-ui.yml .github/workflows/verify-ai-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format AI teacher workflows"
          git push origin HEAD:main
