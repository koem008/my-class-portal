name: Finish Global Companion

on:
  push:
    paths:
      - .github/workflows/finish-global-companion.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate global companion
        run: python scripts/finish_global_companion.py

      - name: Verify privacy-minimized source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'select("id,lesson_date,subject_name,status,curriculum_topic_id")' src/lib/global-assistant-context.ts
          grep -q 'select("id,lesson_id,kind")' src/lib/global-assistant-context.ts
          ! grep -q 'student_aliases' src/lib/global-assistant-context.ts
          ! grep -q 'special_education' src/lib/global-assistant-context.ts
          ! grep -q 'lesson_progress' src/lib/global-assistant-context.ts
          ! grep -q 'teacher_note' src/lib/global-assistant-context.ts
          ! grep -q 'select("id,lesson_id,kind,title' src/lib/global-assistant-context.ts

      - name: Format
        run: bunx prettier --write src/lib/global-assistant-context.ts src/lib/ai/contracts.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts src/routes/asistentka.tsx

      - name: Companion policy tests
        run: bun test src/lib/ai/companion-policy.test.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/global-assistant-context.ts src/lib/ai/contracts.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts src/routes/asistentka.tsx src/routeTree.gen.ts
          git commit -m "feat: give companion privacy-safe global teaching context"
          git push origin HEAD:main
