name: Finish Print PDF

on:
  push:
    paths:
      - .github/workflows/finish-print-pdf.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate print and PDF
        run: python scripts/finish_print_pdf.py

      - name: Format
        run: bunx prettier --write 'src/routes/materialy.$materialId.tsx' src/routes/materialy.tsx src/styles.css

      - name: Lint
        run: bun run lint

      - name: Build and regenerate routes
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/materialy.$materialId.tsx' src/routes/materialy.tsx src/styles.css src/routeTree.gen.ts
          git commit -m "feat: add browser print and PDF export"
          git push origin HEAD:main
