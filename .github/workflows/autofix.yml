name: Lint autofix

on:
  push:
    branches:
      - feature/e2e-lesson-workflow

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/e2e-lesson-workflow

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply safe ESLint fixes
        run: bunx eslint . --fix || true

      - name: Commit autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: auto-fix lint"
          git push origin HEAD:feature/e2e-lesson-workflow
