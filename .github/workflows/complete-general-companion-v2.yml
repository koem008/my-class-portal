name: Complete General Companion V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply companion completion
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"marker missing: {label}")
              return text.replace(old, new, 1)

          # contracts
          p = Path('src/lib/ai/contracts.ts'); s = p.read_text()
          s = once(s,
          '''  continuitySummary?: string;\n  personalPreferences?: string[];''',
          '''  continuitySummary?: string;\n  /** Minimal continuity summary for the current local calendar day only. */\n  sameDayContext?: string;\n  personalPreferences?: string[];''', 'same-day request')
          s = once(s,
          '''export type CompanionResult = {\n  reply: string;\n  navigation?: { target: CompanionNavigationTarget; lessonId?: string };\n  requiresConfirmation: boolean;\n  proposedChange?: string;\n  usage?: AiUsage;\n};''',
          '''export type CompanionPedagogicalProposal =\n  | { type: "save_preparation_note"; lessonId: string; text: string }\n  | { type: "mark_lesson_completed"; lessonId: string; completedSummary?: string };\n\nexport type CompanionResult = {\n  mode: "conversation" | "navigate" | "propose";\n  reply: string;\n  navigation?: { target: CompanionNavigationTarget; lessonId?: string };\n  proposal?: CompanionPedagogicalProposal;\n  /** Minimal carry-forward summary for today only; never a transcript. */\n  sameDaySummary?: string;\n  requiresConfirmation: boolean;\n  usage?: AiUsage;\n};''', 'result contract')
          p.write_text(s)

          # strict pure policy
          Path('src/lib/ai/companion-policy.ts').write_text('''import { assertPrivacySafePayload, type CompanionNavigationTarget, type CompanionPedagogicalProposal, type CompanionResult } from "./contracts";\n\nconst navigationTargets = new Set<CompanionNavigationTarget>(["home", "schedule", "calendar", "memory", "art_studio", "special_education", "lesson"]);\n\nfunction record(value: unknown): Record<string, unknown> | null {\n  return value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : null;\n}\nfunction sameDay(value: unknown): string | undefined {\n  return typeof value === "string" && value.trim() ? value.trim().slice(0, 2000) : undefined;\n}\nfunction parseNavigation(value: unknown): CompanionResult["navigation"] {\n  const item = record(value);\n  if (!item || typeof item.target !== "string" || !navigationTargets.has(item.target as CompanionNavigationTarget)) throw new Error("AI navigace není platná.");\n  const target = item.target as CompanionNavigationTarget;\n  const lessonId = typeof item.lessonId === "string" ? item.lessonId : undefined;\n  if (target === "lesson" && !lessonId) throw new Error("Navigace na hodinu postrádá lessonId.");\n  if (target !== "lesson" && lessonId) throw new Error("lessonId je povolen jen pro konkrétní hodinu.");\n  return { target, lessonId };\n}\nfunction parseProposal(value: unknown): CompanionPedagogicalProposal {\n  const item = record(value);\n  if (!item || typeof item.type !== "string" || typeof item.lessonId !== "string") throw new Error("AI návrh změny není platný.");\n  if (item.type === "save_preparation_note") {\n    if (typeof item.text !== "string" || !item.text.trim()) throw new Error("Návrh přípravy je prázdný.");\n    return { type: item.type, lessonId: item.lessonId, text: item.text.trim() };\n  }\n  if (item.type === "mark_lesson_completed") return { type: item.type, lessonId: item.lessonId, completedSummary: typeof item.completedSummary === "string" && item.completedSummary.trim() ? item.completedSummary.trim() : undefined };\n  throw new Error("AI navrhla nepovolený typ změny.");\n}\nexport function parseCompanionPayload(value: unknown): Omit<CompanionResult, "usage"> {\n  assertPrivacySafePayload(value);\n  const item = record(value);\n  if (!item || typeof item.mode !== "string" || typeof item.reply !== "string" || !item.reply.trim()) throw new Error("AI odpověď není platná.");\n  const summary = sameDay(item.sameDaySummary);\n  if (item.mode === "conversation") {\n    if (item.navigation !== undefined || item.proposal !== undefined) throw new Error("Konverzace nesmí spouštět akci.");\n    return { mode: "conversation", reply: item.reply.trim(), sameDaySummary: summary, requiresConfirmation: false };\n  }\n  if (item.mode === "navigate") {\n    if (item.proposal !== undefined) throw new Error("Navigace nesmí současně zapisovat data.");\n    return { mode: "navigate", reply: item.reply.trim(), navigation: parseNavigation(item.navigation), sameDaySummary: summary, requiresConfirmation: false };\n  }\n  if (item.mode === "propose") {\n    if (item.navigation !== undefined) throw new Error("Návrh změny nesmí současně navigovat.");\n    return { mode: "propose", reply: item.reply.trim(), proposal: parseProposal(item.proposal), sameDaySummary: summary, requiresConfirmation: true };\n  }\n  throw new Error("AI odpověď používá nepovolený režim.");\n}\nexport function navigationPath(target: CompanionNavigationTarget): string {\n  const paths: Record<Exclude<CompanionNavigationTarget, "lesson">, string> = { home: "/", schedule: "/rozvrh", calendar: "/kalendar", memory: "/pamet", art_studio: "/vytvarna-vychova", special_education: "/specialni-pedagogika" };\n  return target === "lesson" ? "/hodina/$lessonId" : paths[target];\n}\n''')

          Path('src/lib/ai/companion-policy.test.ts').write_text('''import { describe, expect, test } from "bun:test";\nimport { navigationPath, parseCompanionPayload } from "./companion-policy";\n\ndescribe("general voice companion policy", () => {\n  test("ordinary conversation only replies", () => {\n    const result = parseCompanionPayload({ mode: "conversation", reply: "Zítra máš čtyři hodiny.", sameDaySummary: "Ráno jsme řešily zítřejší plán." });\n    expect(result.requiresConfirmation).toBe(false); expect(result.navigation).toBeUndefined(); expect(result.proposal).toBeUndefined();\n    expect(result.sameDaySummary).toBe("Ráno jsme řešily zítřejší plán.");\n  });\n  test("schedule navigation is fixed and confirmation-free", () => {\n    const result = parseCompanionPayload({ mode: "navigate", reply: "Otevírám rozvrh.", navigation: { target: "schedule" } });\n    expect(result.requiresConfirmation).toBe(false); expect(result.navigation?.target).toBe("schedule"); expect(navigationPath("schedule")).toBe("/rozvrh");\n  });\n  test("pedagogical write remains proposal-only", () => {\n    const result = parseCompanionPayload({ mode: "propose", reply: "Připravila jsem návrh k potvrzení.", proposal: { type: "mark_lesson_completed", lessonId: "11111111-1111-4111-8111-111111111111", completedSummary: "Probráno." }, sameDaySummary: "Dopoledne se mluvilo o matematice." });\n    expect(result.requiresConfirmation).toBe(true); expect(result.proposal?.type).toBe("mark_lesson_completed"); expect(result.navigation).toBeUndefined();\n  });\n  test("ambiguous/out-of-scope cannot smuggle an action", () => {\n    expect(() => parseCompanionPayload({ mode: "conversation", reply: "Můžeš to upřesnit?", navigation: { target: "schedule" } })).toThrow();\n    const safe = parseCompanionPayload({ mode: "conversation", reply: "Můžeš prosím upřesnit, co chceš?" });\n    expect(safe.navigation).toBeUndefined(); expect(safe.proposal).toBeUndefined();\n  });\n});\n''')

          # functions schema + explicit confirmed write endpoint
          p = Path('src/lib/ai/functions.ts'); s = p.read_text()
          s = once(s, '  continuitySummary: z.string().trim().max(5000).optional(),', '  continuitySummary: z.string().trim().max(5000).optional(),\n  sameDayContext: z.string().trim().max(2000).optional(),', 'request schema same day')
          s = once(s, 'const speechSynthesisSchema = z.object({', '''const companionProposalSchema = z.discriminatedUnion("type", [\n  z.object({ type: z.literal("save_preparation_note"), lessonId: z.string().uuid(), text: z.string().trim().min(1).max(8_000) }),\n  z.object({ type: z.literal("mark_lesson_completed"), lessonId: z.string().uuid(), completedSummary: z.string().trim().max(4_000).optional() }),\n]);\n\nconst speechSynthesisSchema = z.object({''', 'proposal schema')
          marker = 'export const transcribeVoice = createServerFn({ method: "POST" })'
          confirm = '''export const confirmCompanionPedagogicalAction = createServerFn({ method: "POST" })\n  .middleware([requireSupabaseAuth])\n  .validator(companionProposalSchema)\n  .handler(async ({ data, context }) => {\n    const lessonResult = await context.supabase.from("lesson_instances").select("id,school_id,class_id").eq("id", data.lessonId).single();\n    if (lessonResult.error || !lessonResult.data) throw lessonResult.error ?? new Error("Hodina není dostupná.");\n    const lesson = lessonResult.data;\n    if (data.type === "save_preparation_note") {\n      const existing = await context.supabase.from("lesson_preparations").select("id").eq("lesson_id", lesson.id).order("version", { ascending: false }).limit(1).maybeSingle();\n      if (existing.error) throw existing.error;\n      if (existing.data?.id) {\n        const updated = await context.supabase.from("lesson_preparations").update({ teacher_notes: data.text, updated_at: new Date().toISOString() }).eq("id", existing.data.id).eq("lesson_id", lesson.id);\n        if (updated.error) throw updated.error;\n      } else {\n        const inserted = await context.supabase.from("lesson_preparations").insert({ school_id: lesson.school_id, class_id: lesson.class_id, lesson_id: lesson.id, teacher_notes: data.text });\n        if (inserted.error) throw inserted.error;\n      }\n      return { ok: true, message: "Příprava byla uložena po vašem potvrzení." };\n    }\n    const progress = await context.supabase.from("lesson_progress").select("id").eq("lesson_id", lesson.id).maybeSingle();\n    if (progress.error) throw progress.error;\n    if (progress.data?.id) {\n      const updated = await context.supabase.from("lesson_progress").update({ state: "completed", completed_summary: data.completedSummary ?? null, updated_at: new Date().toISOString() }).eq("id", progress.data.id).eq("lesson_id", lesson.id);\n      if (updated.error) throw updated.error;\n    } else {\n      const inserted = await context.supabase.from("lesson_progress").insert({ school_id: lesson.school_id, class_id: lesson.class_id, lesson_id: lesson.id, state: "completed", completed_summary: data.completedSummary ?? null });\n      if (inserted.error) throw inserted.error;\n    }\n    const lessonUpdate = await context.supabase.from("lesson_instances").update({ status: "completed", updated_at: new Date().toISOString() }).eq("id", lesson.id);\n    if (lessonUpdate.error) throw lessonUpdate.error;\n    return { ok: true, message: "Hodina byla označena jako dokončená po vašem potvrzení." };\n  });\n\n'''
          s = once(s, marker, confirm + marker, 'confirmed action function'); p.write_text(s)

          # provider strict parser and same-day summarization
          p = Path('src/lib/ai/provider.server.ts'); s = p.read_text()
          s = once(s, '} from "./contracts";\n', '} from "./contracts";\nimport { parseCompanionPayload } from "./companion-policy";\n', 'policy import')
          old_prompt = '''          "Navigace v aplikaci je bezpečná a může proběhnout bez potvrzení.",\n          "Jakákoli změna pedagogických nebo osobních dat MUSÍ mít requiresConfirmation=true a pouze slovní proposedChange; žádnou změnu sama neprovádíš.",\n          "Vrať pouze validní JSON: reply, navigation volitelně {target, lessonId}, requiresConfirmation, proposedChange volitelně.",\n          "Povolené target: home, schedule, calendar, memory, art_studio, special_education, lesson.",'''
          new_prompt = '''          "Vždy zvol přesně jeden režim: conversation, navigate, propose.",\n          "conversation: běžná konverzace, dotaz, nejasný nebo nepodporovaný požadavek; bez navigation a proposal.",\n          "navigate: jen otevření existující obrazovky z pevného seznamu home, schedule, calendar, memory, art_studio, special_education, lesson. Pro lesson použij výhradně lessonId z availableLessons.",\n          "propose: jen když AKTUÁLNÍ message sama explicitně žádá změnu pedagogických dat. SameDayContext smí pomoci pochopit odkaz, ale nikdy nesmí být sám zdrojem návrhu zápisu.",\n          "Povolené proposal typy: save_preparation_note {lessonId,text}; mark_lesson_completed {lessonId,completedSummary?}. Změnu nikdy sama neprovádíš.",\n          "sameDayContext je dočasné shrnutí pouze dneška. Vrať volitelně sameDaySummary: stručné relevantní shrnutí pro další dnešní konverzaci, nikdy verbatim přepis a nikdy dlouhodobou osobní preferenci.",\n          "Pokud uživatel chce komplexní nový materiál nebo plnou AI přípravu, naviguj na konkrétní hodinu, je-li jednoznačná; jinak se doptávej.",\n          "Vrať pouze validní JSON: conversation={mode,reply,sameDaySummary?}; navigate={mode,reply,navigation,sameDaySummary?}; propose={mode,reply,proposal,sameDaySummary?}.",'''
          s = once(s, old_prompt, new_prompt, 'provider prompt')
          start = s.index('  // JSON.parse is the untyped provider boundary; fields are validated immediately below.', s.index('export async function generateCompanionReply'))
          end_marker = '\n}\n\nexport async function transcribeAudio'
          end = s.index(end_marker, start)
          old_tail = s[start:end]
          new_tail = '''  let parsed: unknown;\n  try {\n    parsed = JSON.parse(stripJsonFence(text));\n  } catch {\n    throw new ExternalAiProviderError("anthropic", "MALFORMED_RESPONSE", "AI odpověď nemá očekávaný strukturovaný formát.");\n  }\n  let result: Omit<CompanionResult, "usage">;\n  try {\n    result = parseCompanionPayload(parsed);\n  } catch {\n    throw new ExternalAiProviderError("anthropic", "MALFORMED_RESPONSE", "AI odpověď je neplatná.");\n  }\n  const usage = asRecord(raw.usage);\n  return { ...result, usage: { provider: "anthropic", model: config.economyModel, inputTokens: numberOrUndefined(usage?.input_tokens), outputTokens: numberOrUndefined(usage?.output_tokens) } };'''
          s = s[:start] + new_tail + s[end:]; p.write_text(s)

          # UI confirmation + same-day minimal browser storage, no long-term personal memory mixing
          p = Path('src/routes/asistentka.tsx'); s = p.read_text()
          s = once(s, 'import { runCompanionAi, synthesizeAssistantVoice, transcribeVoice } from "@/lib/ai/functions";', 'import { confirmCompanionPedagogicalAction, runCompanionAi, synthesizeAssistantVoice, transcribeVoice } from "@/lib/ai/functions";\nimport type { CompanionPedagogicalProposal } from "@/lib/ai/contracts";', 'ui imports')
          s = once(s, '  const [proposedChange, setProposedChange] = useState("");', '  const [pendingProposal, setPendingProposal] = useState<CompanionPedagogicalProposal | null>(null);', 'ui proposal state')
          s = once(s, '    setProposedChange("");', '    setPendingProposal(null);', 'clear proposal')
          s = once(s, '          continuitySummary,\n          personalPreferences:', '          continuitySummary,\n          sameDayContext: readSameDayCompanionMemory(todayIso),\n          personalPreferences:', 'send same day')
          old = '''      setVoiceReply(result.reply);\n      setProposedChange(\n        result.requiresConfirmation\n          ? result.proposedChange || "Tato akce by změnila data a vyžaduje potvrzení."\n          : "",\n      );'''
          new = '''      setVoiceReply(result.reply);\n      setPendingProposal(result.mode === "propose" ? result.proposal ?? null : null);\n      writeSameDayCompanionMemory(todayIso, result.sameDaySummary);'''
          s = once(s, old, new, 'result state')
          s = once(s, 'if (result.navigation && !result.requiresConfirmation) {', 'if (result.mode === "navigate" && result.navigation) {', 'navigation gate')
          s = once(s, '''      if (!result.navigation)\n        setVoiceNotice(\n          result.requiresConfirmation ? "Navržená změna čeká na potvrzení." : "Hotovo.",\n        );''', '''      if (result.mode !== "navigate")\n        setVoiceNotice(result.mode === "propose" ? "Navržená změna čeká na potvrzení." : "Hotovo.");''', 'notice')
          marker = '  return (\n    <main className="min-h-screen'
          confirm_fn = '''  async function confirmPendingProposal() {\n    if (!pendingProposal) return;\n    setVoiceBusy(true);\n    setVoiceNotice("Ukládám potvrzenou změnu…");\n    try {\n      const result = await confirmCompanionPedagogicalAction({ data: pendingProposal });\n      setPendingProposal(null);\n      setVoiceNotice(result.message);\n      await reload();\n    } catch (error) {\n      setVoiceNotice(error instanceof Error ? error.message : "Potvrzenou změnu se nepodařilo uložit.");\n    } finally {\n      setVoiceBusy(false);\n    }\n  }\n\n'''
          s = once(s, marker, confirm_fn + marker, 'confirm function ui')
          old_block = '''                {proposedChange && (\n                  <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4">\n                    <div className="text-xs font-bold text-amber-800">\n                      Návrh změny — zatím neprovedeno\n                    </div>\n                    <p className="mt-1 text-sm text-amber-900">{proposedChange}</p>\n                    <p className="mt-2 text-xs text-amber-700">\n                      Změny pedagogických dat se nikdy neprovedou jen hlasovým požadavkem bez\n                      výslovného potvrzení.\n                    </p>\n                  </div>\n                )}'''
          new_block = '''                {pendingProposal && (\n                  <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4">\n                    <div className="text-xs font-bold text-amber-800">Návrh změny — zatím neprovedeno</div>\n                    <p className="mt-1 text-sm text-amber-900">\n                      {pendingProposal.type === "save_preparation_note"\n                        ? `Uložit jako poznámku k přípravě: ${pendingProposal.text}`\n                        : `Označit hodinu jako dokončenou${pendingProposal.completedSummary ? `: ${pendingProposal.completedSummary}` : "."}`}\n                    </p>\n                    <p className="mt-2 text-xs text-amber-700">Mluvený požadavek sám nic nezapisuje.</p>\n                    <div className="mt-3 flex flex-wrap gap-2">\n                      <button type="button" onClick={() => void confirmPendingProposal()} disabled={voiceBusy} className="rounded-xl bg-amber-800 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">Potvrdit a uložit</button>\n                      <button type="button" onClick={() => { setPendingProposal(null); setVoiceNotice("Návrh byl zrušen. Nic se nezměnilo."); }} disabled={voiceBusy} className="rounded-xl bg-white px-3 py-2 text-xs font-bold text-amber-800 disabled:opacity-50">Zrušit</button>\n                    </div>\n                  </div>\n                )}'''
          s = once(s, old_block, new_block, 'proposal UI')
          helper_marker = 'function Brief({ icon: Icon, title, text }:'
          helpers = '''const SAME_DAY_MEMORY_KEY = "my-class-portal:companion-same-day";\nfunction readSameDayCompanionMemory(date: string): string | undefined {\n  if (typeof window === "undefined") return undefined;\n  try {\n    const raw = window.localStorage.getItem(SAME_DAY_MEMORY_KEY);\n    if (!raw) return undefined;\n    const parsed = JSON.parse(raw) as { date?: string; summary?: string };\n    if (parsed.date !== date) { window.localStorage.removeItem(SAME_DAY_MEMORY_KEY); return undefined; }\n    return typeof parsed.summary === "string" && parsed.summary.trim() ? parsed.summary.trim() : undefined;\n  } catch { window.localStorage.removeItem(SAME_DAY_MEMORY_KEY); return undefined; }\n}\nfunction writeSameDayCompanionMemory(date: string, summary?: string) {\n  if (typeof window === "undefined") return;\n  if (!summary?.trim()) return;\n  window.localStorage.setItem(SAME_DAY_MEMORY_KEY, JSON.stringify({ date, summary: summary.trim().slice(0, 2000) }));\n}\n\n'''
          s = once(s, helper_marker, helpers + helper_marker, 'same-day helpers'); p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/ai/contracts.ts src/lib/ai/companion-policy.ts src/lib/ai/companion-policy.test.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts src/routes/asistentka.tsx
      - name: Required companion policy tests
        run: bun test src/lib/ai/companion-policy.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Verify scoped lesson voice route untouched
        run: git diff --exit-code HEAD -- src/routes/hlas.tsx
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/complete-general-companion.yml .github/workflows/complete-general-companion-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish voice companion and same-day continuity memory"
          git push origin main
