name: Require Explicit Important Date Selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/important-dates-empty-form.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Make date selection fully explicit
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/routes/pamet.tsx')
          s = p.read_text()
          s = s.replace('  const [dateDay, setDateDay] = useState(1);\n  const [dateMonth, setDateMonth] = useState(1);', '  const [dateDay, setDateDay] = useState<number | "">("");\n  const [dateMonth, setDateMonth] = useState<number | "">("");')
          s = s.replace('        day: dateDay,\n        month: dateMonth,', '        day: Number(dateDay),\n        month: Number(dateMonth),')
          s = s.replace('    setDateDay(memory.date_day ?? 1);\n    setDateMonth(memory.date_month ?? 1);', '    setDateDay(memory.date_day ?? "");\n    setDateMonth(memory.date_month ?? "");')
          s = s.replace('    setDateDay(1);\n    setDateMonth(1);', '    setDateDay("");\n    setDateMonth("");')
          s = s.replace('                  onChange={(e) => setDateDay(Number(e.target.value))}', '                  onChange={(e) => setDateDay(e.target.value ? Number(e.target.value) : "")}')
          s = s.replace('                >\n                  {Array.from({ length: 31 }, (_, index) => index + 1).map((day) => (', '                >\n                  <option value="">Vyber den</option>\n                  {Array.from({ length: 31 }, (_, index) => index + 1).map((day) => (', 1)
          s = s.replace('                  onChange={(e) => setDateMonth(Number(e.target.value))}', '                  onChange={(e) => setDateMonth(e.target.value ? Number(e.target.value) : "")}')
          month_anchor = '                >\n                  {months.map((month, index) => ('
          s = s.replace(month_anchor, '                >\n                  <option value="">Vyber měsíc</option>\n                  {months.map((month, index) => (', 1)
          s = s.replace('              disabled={saving || !dateLabel.trim()}', '              disabled={saving || !dateLabel.trim() || !dateDay || !dateMonth}', 1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/pamet.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified change and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/important-dates-empty-form.yml
          git add src/routes/pamet.tsx
          git commit -m "fix: require explicit important date selection"
          git push origin main
