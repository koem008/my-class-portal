name: Verify Coordinator Communication Outcome
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-communication-outcome.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Add structured follow-up outcome
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/assistant-coordinator-items.ts')
          s = p.read_text()
          s = s.replace(
            '  completed_at: string | null;\n  created_at: string;',
            '  completed_at: string | null;\n  outcome: string | null;\n  created_at: string;',
            1,
          )
          s = s.replace(
            '"id,school_id,kind,title,body,assistant_id,class_id,due_on,status,completed_at,created_at",',
            '"id,school_id,kind,title,body,assistant_id,class_id,due_on,status,completed_at,outcome,created_at",',
            1,
          )
          old = '''export async function completeAssistantCoordinationItem(schoolId: string, itemId: string) {\n  const userId = await authUserId();\n  const { error } = await db\n    .from("assistant_coordination_items")\n    .update({\n      status: "done",\n      completed_by: userId,\n      completed_at: new Date().toISOString(),\n    })'''
          new = '''export async function completeAssistantCoordinationItem(\n  schoolId: string,\n  itemId: string,\n  outcome?: string,\n) {\n  const userId = await authUserId();\n  const normalizedOutcome = outcome?.trim() || "";\n  if (normalizedOutcome)\n    assertCoordinatorOrganizationalContent("Výsledek pracovního jednání", normalizedOutcome);\n  const { error } = await db\n    .from("assistant_coordination_items")\n    .update({\n      status: "done",\n      completed_by: userId,\n      completed_at: new Date().toISOString(),\n      outcome: normalizedOutcome || null,\n    })'''
          if old in s:
            s = s.replace(old, new, 1)
          elif 'normalizedOutcome' not in s:
            raise SystemExit('complete item marker missing')
          p.write_text(s)

          p = Path('src/components/assistant-coordinator/CoordinatorItemsCard.tsx')
          s = p.read_text()
          state_marker = '  const [calendarAddedIds, setCalendarAddedIds] = useState<Set<string>>(() => new Set());\n'
          state_add = '  const [outcomeDrafts, setOutcomeDrafts] = useState<Record<string, string>>({});\n'
          if state_add not in s:
            if state_marker not in s: raise SystemExit('outcome state marker missing')
            s = s.replace(state_marker, state_marker + state_add, 1)

          old = '''  async function complete(itemId: string) {\n    setSaving(true);\n    setError("");\n    try {\n      await completeAssistantCoordinationItem(schoolId, itemId);\n      await reload();'''
          new = '''  async function complete(item: AssistantCoordinationItem) {\n    setSaving(true);\n    setError("");\n    try {\n      await completeAssistantCoordinationItem(\n        schoolId,\n        item.id,\n        item.kind === "follow_up" ? outcomeDrafts[item.id] : undefined,\n      );\n      setOutcomeDrafts((current) => {\n        const next = { ...current };\n        delete next[item.id];\n        return next;\n      });\n      await reload();'''
          if old in s:
            s = s.replace(old, new, 1)
          elif 'item.kind === "follow_up" ? outcomeDrafts[item.id]' not in s:
            raise SystemExit('complete UI function marker missing')

          s = s.replace('onClick={() => void complete(item.id)}', 'onClick={() => void complete(item)}', 1)

          body_marker = '''                        {item.body && (\n                          <p className="mt-2 text-sm leading-5 text-[#77837f]">{item.body}</p>\n                        )}\n'''
          outcome_editor = '''                        {item.kind === "follow_up" && (\n                          <label className="mt-3 block text-[11px] font-bold text-[#718079]">\n                            Výsledek jednání (volitelné, uloží se až při dokončení)\n                            <textarea\n                              value={outcomeDrafts[item.id] ?? ""}\n                              onChange={(event) =>\n                                setOutcomeDrafts((current) => ({\n                                  ...current,\n                                  [item.id]: event.target.value,\n                                }))\n                              }\n                              maxLength={800}\n                              rows={2}\n                              placeholder="Např. domluvena změna organizace od příštího týdne"\n                              className="mt-1 w-full resize-none rounded-xl border border-[#ddd8cf] bg-white px-3 py-2 text-xs font-medium text-[#55645f] outline-none focus:border-[#7aa096]"\n                            />\n                          </label>\n                        )}\n'''
          if 'Výsledek jednání (volitelné' not in s:
            if body_marker not in s: raise SystemExit('body render marker missing')
            s = s.replace(body_marker, body_marker + outcome_editor, 1)

          done_marker = '''                    <span className="line-through decoration-[#abb8b2]">{item.title}</span>\n'''
          done_replacement = '''                    <div className="min-w-0">\n                      <span className="line-through decoration-[#abb8b2]">{item.title}</span>\n                      {item.outcome && (\n                        <p className="mt-1 text-[11px] leading-4 text-[#6f7d77]">\n                          Výsledek: {item.outcome}\n                        </p>\n                      )}\n                    </div>\n'''
          if done_marker in s:
            s = s.replace(done_marker, done_replacement, 1)
          elif 'Výsledek: {item.outcome}' not in s:
            raise SystemExit('done item marker missing')
          p.write_text(s)

          # Extend adversarial DB test: safe outcome works, diagnostic outcome is rejected by DB.
          p = Path('tests/sql/assistant_coordinator_rls_adversarial.sql')
          s = p.read_text()
          marker = "-- Cross-tenant writes must fail closed at RLS, not merely disappear from reads.\n"
          addition = '''-- Completion outcome stays inside the same organizational-only boundary.\nupdate public.assistant_coordination_items\nset outcome='Domluvena organizační změna od příštího týdne'\nwhere id='aaaaaaaa-0000-0000-0000-0000000000a0';\nselect pg_temp.assert_count(\n  (select count(*) from public.assistant_coordination_items\n    where id='aaaaaaaa-0000-0000-0000-0000000000a0'\n      and outcome='Domluvena organizační změna od příštího týdne'),\n  1,\n  'coordinator should be able to record a safe organizational outcome'\n);\n\ndo $$\nbegin\n  begin\n    update public.assistant_coordination_items\n    set outcome='Potvrzeno ADHD, pokračovat dál'\n    where id='aaaaaaaa-0000-0000-0000-0000000000a0';\n    raise exception 'ASSERTION FAILED: diagnostic language in outcome unexpectedly succeeded';\n  exception\n    when check_violation then null;\n  end;\nend;\n$$;\n\n'''
          if 'diagnostic language in outcome unexpectedly succeeded' not in s:
            if marker not in s: raise SystemExit('RLS cross-tenant marker missing')
            s = s.replace(marker, addition + marker, 1)
          p.write_text(s)

          migration = Path('supabase/migrations/20260830065000_assistant_coordination_outcome.sql').read_text().lower()
          if "coalesce(outcome,'')" not in migration:
            raise SystemExit('DB organizational-only constraint does not cover outcome')
          if 'assistant_coordination_items_outcome_length' not in migration:
            raise SystemExit('DB outcome length guard missing')
          PY
      - run: bunx prettier --write src/lib/assistant-coordinator-items.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified communication outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260830065000_assistant_coordination_outcome.sql tests/sql/assistant_coordinator_rls_adversarial.sql src/lib/assistant-coordinator-items.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add coordinator communication outcomes"
            git push origin main
          fi
