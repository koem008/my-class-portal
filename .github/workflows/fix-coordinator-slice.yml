name: Fix Coordinator Slice
on:
  push:
    paths:
      - '.github/workflows/fix-coordinator-slice.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Stabilize current-time snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/asistenti.tsx')
          s=p.read_text()
          s=s.replace('  const [scheduleAssignment, setScheduleAssignment] = useState("");\n  const [scheduleWeekday, setScheduleWeekday] = useState(\n    String(coordinatorWeekday(new Date()) || 1),\n  );', '  const [now] = useState(() => new Date());\n  const [scheduleAssignment, setScheduleAssignment] = useState("");\n  const [scheduleWeekday, setScheduleWeekday] = useState(String(coordinatorWeekday(now) || 1));')
          s=s.replace('  const now = new Date();\n  const todayIso = localIsoDate(now);', '  const todayIso = localIsoDate(now);')
          s=s.replace('    [workSlots, exceptions],\n  );', '    [now, workSlots, exceptions],\n  );', 1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/asistenti.tsx src/lib/assistant-coordinator-data.ts
      - run: bun run lint
      - run: bun run build
      - name: Commit stabilized slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/asistenti.tsx src/lib/assistant-coordinator-data.ts src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: stabilize coordinator now card"
            git push origin main
          fi
