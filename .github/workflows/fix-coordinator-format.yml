name: Fix Coordinator Format
on:
  push:
    paths:
      - '.github/workflows/fix-coordinator-format.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/assistant-coordinator-data.ts src/routes/asistenti.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/assistant-coordinator-data.ts src/routes/asistenti.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: format coordinator schedule slice"
            git push origin main
          fi
