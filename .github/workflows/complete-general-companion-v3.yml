name: Complete General Companion V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reuse verified V2 patch logic
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/complete-general-companion-v2.yml').read_text()
          code = workflow.split("python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(code), {})
          PY
      - name: Normalize formatting
        run: |
          bunx prettier --write src/lib/ai/contracts.ts src/lib/ai/companion-policy.ts src/lib/ai/companion-policy.test.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts src/routes/asistentka.tsx
          bunx eslint src/lib/ai/functions.ts --fix
      - name: Required companion policy tests
        run: bun test src/lib/ai/companion-policy.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Verify scoped lesson voice route untouched
        run: git diff --exit-code HEAD -- src/routes/hlas.tsx
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/complete-general-companion.yml .github/workflows/complete-general-companion-v2.yml .github/workflows/complete-general-companion-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish voice companion and same-day continuity memory"
          git push origin main
