name: Verify Coordinator Items Slice
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-items-slice.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire coordinator items UI and extend RLS test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/asistenti.tsx')
          s = p.read_text()
          marker = 'import { useEffect, useMemo, useState, type ReactNode } from "react";\n'
          addition = marker + 'import { CoordinatorItemsCard } from "@/components/assistant-coordinator/CoordinatorItemsCard";\n'
          if 'CoordinatorItemsCard' not in s:
              if marker not in s: raise SystemExit('route import marker missing')
              s = s.replace(marker, addition, 1)
          render_marker = '        <div className="mt-6 grid gap-5 lg:grid-cols-2">\n'
          render = '        <CoordinatorItemsCard\n          schoolId={context.access.schoolId}\n          assistants={assistants}\n          classes={classes}\n        />\n\n' + render_marker
          if '<CoordinatorItemsCard' not in s:
              if render_marker not in s: raise SystemExit('route render marker missing')
              s = s.replace(render_marker, render, 1)
          p.write_text(s)

          p = Path('tests/sql/assistant_coordinator_rls_adversarial.sql')
          s = p.read_text()
          seed_marker = '-- Seed sensitive content to prove the coordinator cannot see it through the alias reference.\n'
          seed = '''insert into public.assistant_coordination_items(\n  id,school_id,kind,title,body,assistant_id,class_id,due_on,status,created_by\n) values\n  ('aaaaaaaa-0000-0000-0000-0000000000a0','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','task','Follow-up A','Organizační fixture','aaaaaaaa-0000-0000-0000-000000000030','aaaaaaaa-0000-0000-0000-000000000010','2026-09-09','open','11111111-1111-1111-1111-111111111111'),\n  ('bbbbbbbb-0000-0000-0000-0000000000a0','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb','task','Follow-up B','Organizační fixture','bbbbbbbb-0000-0000-0000-000000000030','bbbbbbbb-0000-0000-0000-000000000010','2026-09-09','open','44444444-4444-4444-4444-444444444444');\n\n'''
          if 'Follow-up A' not in s:
              if seed_marker not in s: raise SystemExit('test seed marker missing')
              s = s.replace(seed_marker, seed + seed_marker, 1)

          teacher_marker = '-- 2) Coordinator A sees own tenant only, never School B.\n'
          teacher_assert = '''select pg_temp.assert_count(\n  (select count(*) from public.assistant_coordination_items),\n  0,\n  'ordinary teacher must not see assistant coordination items'\n);\n\n'''
          if 'ordinary teacher must not see assistant coordination items' not in s:
              if teacher_marker not in s: raise SystemExit('teacher marker missing')
              s = s.replace(teacher_marker, teacher_assert + teacher_marker, 1)

          cross_marker = '-- Cross-tenant writes must fail closed at RLS, not merely disappear from reads.\n'
          coordinator_assert = '''select pg_temp.assert_count(\n  (select count(*) from public.assistant_coordination_items where school_id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'),\n  1,\n  'coordinator A should see own coordination item'\n);\nselect pg_temp.assert_count(\n  (select count(*) from public.assistant_coordination_items where school_id='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb'),\n  0,\n  'coordinator A must not see School B coordination item'\n);\n\n'''
          if 'coordinator A should see own coordination item' not in s:
              if cross_marker not in s: raise SystemExit('cross marker missing')
              s = s.replace(cross_marker, coordinator_assert + cross_marker, 1)

          alias_marker = '-- 3) Alias access is intentionally narrow: no direct student_aliases visibility,\n'
          write_test = '''do $$\nbegin\n  begin\n    insert into public.assistant_coordination_items(\n      school_id,kind,title,assistant_id,class_id,status,created_by\n    ) values (\n      'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb','task','Unauthorized follow-up',\n      'bbbbbbbb-0000-0000-0000-000000000030','bbbbbbbb-0000-0000-0000-000000000010',\n      'open','22222222-2222-2222-2222-222222222222'\n    );\n    raise exception 'ASSERTION FAILED: coordinator A inserted School B coordination item';\n  exception\n    when others then\n      if sqlerrm like 'ASSERTION FAILED:%' then raise; end if;\n  end;\nend $$;\n\n'''
          if 'coordinator A inserted School B coordination item' not in s:
              if alias_marker not in s: raise SystemExit('alias marker missing')
              s = s.replace(alias_marker, write_test + alias_marker, 1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/lib/assistant-coordinator-items.ts src/routes/asistenti.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/lib/assistant-coordinator-items.ts src/routes/asistenti.tsx tests/sql/assistant_coordinator_rls_adversarial.sql src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: surface coordinator tasks and follow-ups"
            git push origin main
          fi
