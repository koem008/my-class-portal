name: Verify Coordinator Calendar State
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-calendar-state.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Load persistent calendar-link state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/assistant-coordinator/CoordinatorItemsCard.tsx')
          s=p.read_text()
          old='import { ensureCoordinatorItemInCalendar } from "@/lib/assistant-coordinator-calendar";'
          new='''import {\n  ensureCoordinatorItemInCalendar,\n  loadCoordinatorCalendarItemIds,\n} from "@/lib/assistant-coordinator-calendar";'''
          if old in s:
            s=s.replace(old,new,1)
          elif 'loadCoordinatorCalendarItemIds' not in s:
            raise SystemExit('calendar helper import marker missing')

          old='''      const rows = await loadAssistantCoordinationItems(schoolId, assistants, classes);\n      setItems(rows);\n      onOpenItemsChange?.(rows.filter((item) => item.status === "open"));'''
          new='''      const rows = await loadAssistantCoordinationItems(schoolId, assistants, classes);\n      const openRows = rows.filter((item) => item.status === "open");\n      const linkedIds = await loadCoordinatorCalendarItemIds(\n        schoolId,\n        openRows.filter((item) => item.due_on).map((item) => item.id),\n      );\n      setItems(rows);\n      setCalendarAddedIds(linkedIds);\n      onOpenItemsChange?.(openRows);'''
          if old in s:
            s=s.replace(old,new,1)
          elif 'setCalendarAddedIds(linkedIds)' not in s:
            raise SystemExit('reload marker missing')
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/assistant-coordinator-calendar.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified persistent state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/assistant-coordinator-calendar.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: persist coordinator calendar link state"
            git push origin main
          fi
