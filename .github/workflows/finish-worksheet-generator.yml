name: Finish Worksheet Generator

on:
  push:
    paths:
      - .github/workflows/finish-worksheet-generator.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate worksheet generator
        run: python scripts/finish_worksheet_generator.py

      - name: Format
        run: bunx prettier --write src/lib/ai/contracts.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts 'src/routes/hodina.$lessonId.tsx'

      - name: Companion policy tests
        run: bun test src/lib/ai/companion-policy.test.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/contracts.ts src/lib/ai/functions.ts src/lib/ai/provider.server.ts 'src/routes/hodina.$lessonId.tsx' src/routeTree.gen.ts
          git commit -m "feat: add structured worksheet generator"
          git push origin HEAD:main
