name: Patch Companion Navigation

on:
  push:
    paths:
      - .github/workflows/patch-companion-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch provider navigation source
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/ai/provider.server.ts')
          text = path.read_text()
          old_import = 'import { parseCompanionPayload } from "./companion-policy";'
          new_import = 'import { COMPANION_NAVIGATION_TARGETS, parseCompanionPayload } from "./companion-policy";'
          if old_import not in text and new_import not in text:
              raise SystemExit('Expected companion-policy import not found')
          text = text.replace(old_import, new_import)
          old_line = '          "navigate: jen otevření existující obrazovky z pevného seznamu home, schedule, calendar, memory, art_studio, special_education, assistants, lesson. Pro lesson použij výhradně lessonId z availableLessons.",'
          new_line = '          `navigate: jen otevření existující obrazovky z pevného seznamu ${COMPANION_NAVIGATION_TARGETS.join(", ")}. Pro lesson použij výhradně lessonId z availableLessons.`, '
          if old_line not in text and 'COMPANION_NAVIGATION_TARGETS.join' not in text:
              raise SystemExit('Expected navigation prompt line not found')
          text = text.replace(old_line, new_line)
          path.write_text(text)

      - name: Format changed navigation files
        run: bunx prettier --write src/lib/ai/provider.server.ts src/lib/ai/companion-policy.ts src/lib/ai/companion-policy.test.ts src/components/QuickNavigation.tsx src/routes/__root.tsx src/lib/ai/contracts.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/provider.server.ts src/lib/ai/companion-policy.ts src/lib/ai/companion-policy.test.ts src/components/QuickNavigation.tsx src/routes/__root.tsx src/lib/ai/contracts.ts
          git commit -m "fix: unify companion navigation source"
          git push origin HEAD:main
