name: Apply final Definition of Done

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-master-example-53.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite master Definition of Done
        run: python scripts/rewrite_master_dod.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_PROMPT_MOJE_TRIDA.md
          git commit -m "docs: make MVP Definition of Done verifiable"
          git push origin HEAD:main
