name: Finish Master Example 50

on:
  push:
    paths:
      - .github/workflows/finish-master-example-50.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply lesson continuity patch
        run: python scripts/finish_master_example_50.py

      - name: Guard privacy source
        shell: bash
        run: |
          grep -q 'pseudonymNeeds: buildPlanningPseudonymNeeds' 'src/routes/hodina.$lessonId.tsx'
          grep -q 'signal.student_alias?.alias' src/lib/lesson-workspace-data.ts
          ! grep -nE 'student.*name|birth|email|address' scripts/finish_master_example_50.py

      - name: Format
        run: bunx prettier --write src/lib/lesson-workspace-data.ts 'src/routes/hodina.$lessonId.tsx'

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/lesson-workspace-data.ts 'src/routes/hodina.$lessonId.tsx'
          git commit -m "feat: carry confirmed learning signals into next lesson AI"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
