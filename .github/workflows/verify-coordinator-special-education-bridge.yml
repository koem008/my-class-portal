name: Verify Coordinator Special Education Bridge
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-special-education-bridge.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire conscious role bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/routes/asistenti.tsx')
          s = route.read_text()
          import_marker = 'import { CoordinatorMeetingBriefCard } from "@/components/assistant-coordinator/CoordinatorMeetingBriefCard";\n'
          import_line = 'import { CoordinatorSpecialEducationBridge } from "@/components/assistant-coordinator/CoordinatorSpecialEducationBridge";\n'
          if import_line not in s:
            if import_marker not in s:
              raise SystemExit('meeting brief import marker missing')
            s = s.replace(import_marker, import_marker + import_line, 1)

          component = '''<CoordinatorSpecialEducationBridge\n          schoolId={context.access.schoolId}\n          assignments={assignments}\n        />\n\n        '''
          if '<CoordinatorSpecialEducationBridge' not in s:
            marker = '<CoordinatorItemsCard'
            idx = s.find(marker)
            if idx < 0:
              raise SystemExit('CoordinatorItemsCard marker missing')
            s = s[:idx] + component + s[idx:]
          route.write_text(s)

          helper = Path('src/lib/assistant-coordinator-special-education.ts').read_text()
          forbidden = ['focus_summary', 'diagnosis_code', 'observation', 'observed_effect', 'source_reference']
          for token in forbidden:
            if token in helper:
              raise SystemExit(f'privacy bridge contains forbidden case content token: {token}')
          if '.select("id,student_alias_id,status")' not in helper:
            raise SystemExit('bridge is not restricted to minimal case fields')
          if 'special_education_practitioners' not in helper:
            raise SystemExit('bridge lacks explicit practitioner authorization check')
          PY
      - run: bunx prettier --write src/lib/assistant-coordinator-special-education.ts src/components/assistant-coordinator/CoordinatorSpecialEducationBridge.tsx src/routes/asistenti.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/assistant-coordinator-special-education.ts src/components/assistant-coordinator/CoordinatorSpecialEducationBridge.tsx src/routes/asistenti.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add conscious coordinator special-education bridge"
            git push origin main
          fi
