name: Verify Assistant Coordinator Slice
on:
  push:
    paths:
      - '.github/workflows/verify-assistant-coordinator-slice.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch navigation and type import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/index.tsx')
          s=p.read_text()
          s=s.replace('  Users,\n} from "lucide-react";', '  Users,\n  UsersRound,\n} from "lucide-react";')
          s=s.replace('  { to: "/trida" as const, label: "Třída", icon: Users },\n  { to: "/asistentka" as const, label: "Asistentka", icon: Sparkles },', '  { to: "/trida" as const, label: "Třída", icon: Users },\n  { to: "/asistenti" as const, label: "Asistenti", icon: UsersRound },\n  { to: "/asistentka" as const, label: "Asistentka", icon: Sparkles },')
          p.write_text(s)

          p=Path('src/routes/asistenti.tsx')
          s=p.read_text()
          s=s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useState, type ReactNode } from "react";')
          s=s.replace('children: React.ReactNode', 'children: ReactNode')
          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/asistenti.tsx src/routes/index.tsx src/lib/assistant-coordinator-data.ts
      - run: bun run lint
      - run: bun run build
      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/asistenti.tsx src/routes/index.tsx src/lib/assistant-coordinator-data.ts src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: surface assistant coordinator workspace"
            git push origin main
          fi
      # retry: typed coordinator data layer
