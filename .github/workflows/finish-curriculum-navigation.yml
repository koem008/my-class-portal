name: Finish Curriculum Navigation

on:
  push:
    paths:
      - .github/workflows/finish-curriculum-navigation.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate curriculum navigation
        run: python scripts/finish_curriculum_navigation.py

      - name: Format
        run: bunx prettier --write src/lib/curriculum-overview-data.ts src/routes/ucivo.tsx src/components/QuickNavigation.tsx src/lib/global-search-data.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/curriculum-overview-data.ts src/routes/ucivo.tsx src/components/QuickNavigation.tsx src/lib/global-search-data.ts src/routeTree.gen.ts
          git commit -m "feat: add real curriculum navigation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
