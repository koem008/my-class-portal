name: Format Onboarding Gate

on:
  push:
    paths:
      - .github/workflows/format-onboarding-gate.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format onboarding files
        run: bunx prettier --write src/routes/zacatek.tsx src/lib/onboarding-data.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/zacatek.tsx src/lib/onboarding-data.ts src/routeTree.gen.ts
          git commit -m "fix: format guided onboarding"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
