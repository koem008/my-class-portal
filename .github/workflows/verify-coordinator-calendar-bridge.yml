name: Verify Coordinator Calendar Bridge
on:
  push:
    paths:
      - '.github/workflows/verify-coordinator-calendar-bridge.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire privacy-safe calendar action and extend RLS test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/assistant-coordinator/CoordinatorItemsCard.tsx')
          s = p.read_text()
          s = s.replace('''  CheckCircle2,\n  ClipboardList,''','''  CheckCircle2,\n  CalendarPlus,\n  ClipboardList,''',1)
          marker = 'import type { CoordinatorClass, TeachingAssistant } from "@/lib/assistant-coordinator-data";\n'
          addition = 'import { ensureCoordinatorItemInCalendar } from "@/lib/assistant-coordinator-calendar";\n'
          if addition not in s:
            if marker not in s: raise SystemExit('calendar import marker missing')
            s = s.replace(marker, marker + addition, 1)

          state_marker = '  const [dueOn, setDueOn] = useState("");\n'
          state_add = '''  const [calendarSavingId, setCalendarSavingId] = useState<string | null>(null);\n  const [calendarAddedIds, setCalendarAddedIds] = useState<Set<string>>(() => new Set());\n'''
          if 'calendarSavingId' not in s:
            if state_marker not in s: raise SystemExit('state marker missing')
            s = s.replace(state_marker, state_marker + state_add, 1)

          function_marker = '''  async function complete(itemId: string) {\n'''
          function_add = '''  async function addToCalendar(item: AssistantCoordinationItem) {\n    if (!item.due_on) return;\n    setCalendarSavingId(item.id);\n    setError("");\n    try {\n      await ensureCoordinatorItemInCalendar({\n        schoolId,\n        itemId: item.id,\n        kind: item.kind,\n        dueOn: item.due_on,\n      });\n      setCalendarAddedIds((current) => {\n        const next = new Set(current);\n        next.add(item.id);\n        return next;\n      });\n    } catch (e) {\n      setError(e instanceof Error ? e.message : "Položku se nepodařilo přidat do kalendáře.");\n    } finally {\n      setCalendarSavingId(null);\n    }\n  }\n\n'''
          if 'async function addToCalendar' not in s:
            if function_marker not in s: raise SystemExit('function marker missing')
            s = s.replace(function_marker, function_add + function_marker, 1)

          button_marker = '''                      <div className="flex shrink-0 gap-1">\n                        <button\n                          disabled={saving}\n                          onClick={() => void complete(item.id)}'''
          button_add = '''                      <div className="flex shrink-0 gap-1">\n                        {item.due_on && (\n                          <button\n                            disabled={saving || calendarSavingId === item.id}\n                            onClick={() => void addToCalendar(item)}\n                            className="inline-flex items-center gap-1 rounded-xl px-2 py-2 text-[11px] font-black text-[#5e7184] transition hover:bg-[#edf3f7] disabled:opacity-40"\n                            aria-label={\n                              calendarAddedIds.has(item.id)\n                                ? "Přidáno do kalendáře"\n                                : "Přidat do kalendáře"\n                            }\n                            title={\n                              calendarAddedIds.has(item.id)\n                                ? "Už je v kalendáři"\n                                : "Přidat neutrální soukromou událost do kalendáře"\n                            }\n                          >\n                            {calendarSavingId === item.id ? (\n                              <Loader2 className="h-4 w-4 animate-spin" />\n                            ) : (\n                              <CalendarPlus className="h-4 w-4" />\n                            )}\n                            {calendarAddedIds.has(item.id) ? "Přidáno" : "Kalendář"}\n                          </button>\n                        )}\n                        <button\n                          disabled={saving}\n                          onClick={() => void complete(item.id)}'''
          if 'calendarAddedIds.has(item.id) ? "Přidáno" : "Kalendář"' not in s:
            if button_marker not in s: raise SystemExit('button marker missing')
            s = s.replace(button_marker, button_add, 1)
          p.write_text(s)

          p = Path('tests/sql/assistant_coordinator_rls_adversarial.sql')
          s = p.read_text()
          seed_marker = '-- Seed sensitive content to prove the coordinator cannot see it through the alias reference.\n'
          seed = '''insert into public.calendar_events(\n  id,school_id,academic_year_id,created_by,scope,kind,title,starts_at,ends_at,all_day,source\n) values (\n  'aaaaaaaa-0000-0000-0000-0000000000b0','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',\n  'aaaaaaaa-0000-0000-0000-000000000001','22222222-2222-2222-2222-222222222222',\n  'private','meeting','Koordinace AP · follow-up','2026-09-09 00:00:00+02','2026-09-10 00:00:00+02',true,\n  'assistant_coordinator:aaaaaaaa-0000-0000-0000-0000000000a0'\n);\n\n'''
          if 'assistant_coordinator:aaaaaaaa-0000-0000-0000-0000000000a0' not in s:
            if seed_marker not in s: raise SystemExit('test seed marker missing')
            s = s.replace(seed_marker, seed + seed_marker, 1)

          teacher_marker = '-- 2) Coordinator A sees own tenant only, never School B.\n'
          teacher_assert = '''select pg_temp.assert_count(\n  (select count(*) from public.calendar_events where source like 'assistant_coordinator:%'),\n  0,\n  'ordinary teacher must not see coordinator private calendar event'\n);\n\n'''
          if 'ordinary teacher must not see coordinator private calendar event' not in s:
            if teacher_marker not in s: raise SystemExit('teacher calendar marker missing')
            s = s.replace(teacher_marker, teacher_assert + teacher_marker, 1)

          coord_marker = '-- Cross-tenant writes must fail closed at RLS, not merely disappear from reads.\n'
          coord_assert = '''select pg_temp.assert_count(\n  (select count(*) from public.calendar_events where source like 'assistant_coordinator:%'),\n  1,\n  'coordinator should see own private calendar event'\n);\n\n'''
          if 'coordinator should see own private calendar event' not in s:
            if coord_marker not in s: raise SystemExit('coordinator calendar marker missing')
            s = s.replace(coord_marker, coord_assert + coord_marker, 1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/assistant-coordinator-calendar.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit verified calendar bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/assistant-coordinator-calendar.ts src/components/assistant-coordinator/CoordinatorItemsCard.tsx tests/sql/assistant_coordinator_rls_adversarial.sql src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add privacy-safe coordinator calendar action"
            git push origin main
          fi
