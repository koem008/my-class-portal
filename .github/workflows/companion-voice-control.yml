name: General Voice Companion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch companion contracts, provider, server function and UI
        run: |
          python <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'marker missing: {label}')
              return text.replace(old, new, 1)

          # contracts
          p=Path('src/lib/ai/contracts.ts'); s=p.read_text()
          marker='export type SpeechTranscriptionRequest = {'
          addition='''export type CompanionTone = "friendly" | "calm" | "efficient" | "custom";\nexport type CompanionNavigationTarget =\n  | "home"\n  | "schedule"\n  | "calendar"\n  | "memory"\n  | "art_studio"\n  | "special_education"\n  | "lesson";\n\nexport type CompanionConversationTurn = { role: "user" | "assistant"; text: string };\n\n/** Minimal, privacy-safe context for the general teacher companion. */\nexport type CompanionRequest = {\n  message: string;\n  assistantName: string;\n  tone: CompanionTone;\n  todaySummary?: string;\n  continuitySummary?: string;\n  personalPreferences?: string[];\n  recentConversation?: CompanionConversationTurn[];\n  availableLessons?: Array<{ lessonId: string; subject: string; topic?: string }>;\n};\n\nexport type CompanionResult = {\n  reply: string;\n  navigation?: { target: CompanionNavigationTarget; lessonId?: string };\n  requiresConfirmation: boolean;\n  proposedChange?: string;\n  usage?: AiUsage;\n};\n\n'''
          s=once(s, marker, addition+marker, 'contracts insertion')
          p.write_text(s)

          # provider imports + function
          p=Path('src/lib/ai/provider.server.ts'); s=p.read_text()
          s=once(s, '  type ArtImageResult,\n', '  type ArtImageResult,\n  type CompanionRequest,\n  type CompanionResult,\n', 'provider imports')
          marker='export async function transcribeAudio('
          fn='''export async function generateCompanionReply(\n  config: AnthropicTextProviderConfig,\n  request: CompanionRequest,\n  signal?: AbortSignal,\n): Promise<CompanionResult> {\n  assertPrivacySafePayload(request);\n  if (!config.apiKey) {\n    throw new ExternalAiProviderError("anthropic", "AI_NOT_CONFIGURED", "AI zatím není připojena.");\n  }\n  const response = await fetchWithTimeout(\n    config.baseUrl,\n    {\n      method: "POST",\n      headers: {\n        "content-type": "application/json",\n        "x-api-key": config.apiKey,\n        "anthropic-version": ANTHROPIC_VERSION,\n      },\n      body: JSON.stringify({\n        model: config.economyModel,\n        max_tokens: 1200,\n        system: [\n          "Jsi obecná hlasová pracovní asistentka české učitelky.",\n          "Buď přirozená, stručná a praktická. Nepředstírej vědomí, city ani skutečný osobní vztah.",\n          "Používej pouze dodaný pracovní kontext a explicitně povolené osobní preference.",\n          "Nikdy neodvozuj osobní fakta a nikdy nepožaduj skutečnou identitu dítěte.",\n          "Navigace v aplikaci je bezpečná a může proběhnout bez potvrzení.",\n          "Jakákoli změna pedagogických nebo osobních dat MUSÍ mít requiresConfirmation=true a pouze slovní proposedChange; žádnou změnu sama neprovádíš.",\n          "Vrať pouze validní JSON: reply, navigation volitelně {target, lessonId}, requiresConfirmation, proposedChange volitelně.",\n          "Povolené target: home, schedule, calendar, memory, art_studio, special_education, lesson.",\n        ].join("\\n"),\n        messages: [{ role: "user", content: JSON.stringify(request) }],\n      }),\n      signal,\n    },\n    "anthropic",\n  );\n  const raw = (await parseJsonResponse(response, "anthropic")) as Record<string, unknown>;\n  const blocks = Array.isArray(raw.content) ? raw.content : [];\n  const text = blocks\n    .map((block) => {\n      if (!block || typeof block !== "object") return "";\n      const value = block as Record<string, unknown>;\n      return value.type === "text" && typeof value.text === "string" ? value.text : "";\n    })\n    .filter(Boolean)\n    .join("\\n")\n    .trim();\n  if (!text) throw new ExternalAiProviderError("anthropic", "MALFORMED_RESPONSE", "AI vrátila prázdnou odpověď.");\n  let parsed: any;\n  try { parsed = JSON.parse(stripJsonFence(text)); } catch {\n    throw new ExternalAiProviderError("anthropic", "MALFORMED_RESPONSE", "AI odpověď nemá očekávaný strukturovaný formát.");\n  }\n  assertPrivacySafePayload(parsed);\n  if (!parsed || typeof parsed.reply !== "string" || typeof parsed.requiresConfirmation !== "boolean") {\n    throw new ExternalAiProviderError("anthropic", "MALFORMED_RESPONSE", "AI odpověď je neplatná.");\n  }\n  const allowed = new Set(["home","schedule","calendar","memory","art_studio","special_education","lesson"]);\n  const nav = parsed.navigation && typeof parsed.navigation === "object" && allowed.has(parsed.navigation.target)\n    ? { target: parsed.navigation.target, lessonId: typeof parsed.navigation.lessonId === "string" ? parsed.navigation.lessonId : undefined }\n    : undefined;\n  const usage = asRecord(raw.usage);\n  return {\n    reply: parsed.reply.trim(),\n    navigation: nav,\n    requiresConfirmation: parsed.requiresConfirmation,\n    proposedChange: typeof parsed.proposedChange === "string" ? parsed.proposedChange.trim() : undefined,\n    usage: { provider: "anthropic", model: config.economyModel, inputTokens: numberOrUndefined(usage?.input_tokens), outputTokens: numberOrUndefined(usage?.output_tokens) },\n  };\n}\n\n'''
          s=once(s, marker, fn+marker, 'provider companion function')
          p.write_text(s)

          # server function
          p=Path('src/lib/ai/functions.ts'); s=p.read_text()
          marker='const speechSynthesisSchema = z.object({'
          schema='''const companionRequestSchema = z.object({\n  message: z.string().trim().min(1).max(4000),\n  assistantName: z.string().trim().min(1).max(80),\n  tone: z.enum(["friendly", "calm", "efficient", "custom"]),\n  todaySummary: z.string().trim().max(8000).optional(),\n  continuitySummary: z.string().trim().max(5000).optional(),\n  personalPreferences: z.array(z.string().trim().max(500)).max(20).optional(),\n  recentConversation: z.array(z.object({ role: z.enum(["user", "assistant"]), text: z.string().trim().max(2000) })).max(8).optional(),\n  availableLessons: z.array(z.object({ lessonId: z.string().uuid(), subject: z.string().trim().max(160), topic: z.string().trim().max(500).optional() })).max(20).optional(),\n});\n\n'''
          s=once(s, marker, schema+marker, 'functions schema')
          marker='export const transcribeVoice = createServerFn({ method: "POST" })'
          fn='''export const runCompanionAi = createServerFn({ method: "POST" })\n  .middleware([requireSupabaseAuth])\n  .validator(companionRequestSchema)\n  .handler(async ({ data }) => {\n    const { generateCompanionReply, readAnthropicTextProviderConfigFromEnv } = await import("./provider.server");\n    const config = readAnthropicTextProviderConfigFromEnv();\n    if (!config) throw new Error("AI zatím není připojena.");\n    return generateCompanionReply(config, data);\n  });\n\n'''
          s=once(s, marker, fn+marker, 'functions companion')
          p.write_text(s)

          # asistentka UI
          p=Path('src/routes/asistentka.tsx'); s=p.read_text()
          s=once(s, 'import { createFileRoute, Link } from "@tanstack/react-router";', 'import { createFileRoute, Link, useNavigate } from "@tanstack/react-router";', 'navigate import')
          s=once(s, '  Mic,\n', '  Mic,\n  MicOff,\n  Volume2,\n', 'voice icons')
          s=once(s, 'import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useRef, useState } from "react";\nimport { runCompanionAi, synthesizeAssistantVoice, transcribeVoice } from "@/lib/ai/functions";\nimport { loadAssistantMemory } from "@/lib/assistant-memory-data";', 'voice imports')
          s=once(s, 'function AssistantPage() {\n', 'function AssistantPage() {\n  const navigate = useNavigate();\n', 'navigate state')
          old='''  const [tone, setTone] = useState<Tone>("Přátelská");\n  const [listening, setListening] = useState(false);\n'''
          new='''  const [tone, setTone] = useState<Tone>("Přátelská");\n  const [listening, setListening] = useState(false);\n  const [voiceBusy, setVoiceBusy] = useState(false);\n  const [voiceTranscript, setVoiceTranscript] = useState("");\n  const [voiceReply, setVoiceReply] = useState("");\n  const [voiceNotice, setVoiceNotice] = useState("");\n  const [proposedChange, setProposedChange] = useState("");\n  const recorderRef = useRef<MediaRecorder | null>(null);\n  const streamRef = useRef<MediaStream | null>(null);\n  const chunksRef = useRef<Blob[]>([]);\n'''
          s=once(s, old, new, 'voice state')
          marker='  const message = briefing ? buildMorningMessage(briefing) : "Dobré ráno.";\n'
          funcs='''  const message = briefing ? buildMorningMessage(briefing) : "Dobré ráno.";\n\n  async function startGeneralVoice() {\n    if (listening) { recorderRef.current?.stop(); return; }\n    setVoiceNotice(""); setProposedChange("");\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      streamRef.current = stream; chunksRef.current = [];\n      const recorder = new MediaRecorder(stream); recorderRef.current = recorder;\n      recorder.ondataavailable = (event) => { if (event.data.size) chunksRef.current.push(event.data); };\n      recorder.onstop = () => {\n        setListening(false); stream.getTracks().forEach((track) => track.stop()); streamRef.current = null;\n        void processGeneralVoice(recorder.mimeType || "audio/webm");\n      };\n      recorder.start(); setListening(true);\n    } catch (error) { setVoiceNotice(error instanceof Error ? error.message : "Mikrofon se nepodařilo spustit."); }\n  }\n\n  async function processGeneralVoice(mimeType: string) {\n    const chunks = chunksRef.current; chunksRef.current = [];\n    if (!chunks.length) return;\n    setVoiceBusy(true); setVoiceNotice("Přepisuji…");\n    try {\n      const blob = new Blob(chunks, { type: mimeType });\n      const form = new FormData(); form.append("audio", blob, "asistentka.webm");\n      const transcribed = await transcribeVoice({ data: form });\n      setVoiceTranscript(transcribed.text); setVoiceNotice("Přemýšlím nad požadavkem…");\n      let settings: any = null; let memories: any[] = [];\n      try { const loaded = await loadAssistantMemory(); settings = loaded.settings; memories = loaded.memories; } catch { /* companion works without personal memory */ }\n      const todaySummary = briefing ? [\n        `${briefing.classInfo.name}: ${briefing.lessons.length} hodin, ${briefing.readyCount} připravených.`,\n        briefing.events.length ? `Události: ${briefing.events.map((e) => e.title).join(", ")}.` : "Bez zvláštních událostí.",\n      ].join(" ") : undefined;\n      const continuitySummary = briefing?.carryOvers.length ? briefing.carryOvers.map((c) => `${c.subject}: ${c.unfinished}${c.nextNote ? `; příště ${c.nextNote}` : ""}`).join("\\n") : undefined;\n      const result = await runCompanionAi({ data: {\n        message: transcribed.text,\n        assistantName: settings?.assistant_name || "Asistentka",\n        tone: settings?.tone || ({ Přátelská: "friendly", Klidná: "calm", Efektivní: "efficient" } as const)[tone],\n        todaySummary, continuitySummary,\n        personalPreferences: settings?.memory_enabled ? memories.map((m) => m.content) : undefined,\n        availableLessons: briefing?.lessons.map((l) => ({ lessonId: l.id, subject: l.subject_name, topic: l.topic || l.title || undefined })),\n      } });\n      setVoiceReply(result.reply); setProposedChange(result.requiresConfirmation ? (result.proposedChange || "Tato akce by změnila data a vyžaduje potvrzení.") : "");\n      if (result.reply.trim()) {\n        try { const speech = await synthesizeAssistantVoice({ data: { text: result.reply.slice(0, 2500) } }); await new Audio(`data:${speech.mimeType};base64,${speech.audioBase64}`).play(); } catch { setVoiceNotice("Odpověď je připravená, hlasové přehrání zatím není dostupné."); }\n      }\n      if (result.navigation && !result.requiresConfirmation) {\n        const nav = result.navigation;\n        if (nav.target === "home") await navigate({ to: "/" });\n        else if (nav.target === "schedule") await navigate({ to: "/rozvrh" });\n        else if (nav.target === "calendar") await navigate({ to: "/kalendar" });\n        else if (nav.target === "memory") await navigate({ to: "/pamet" });\n        else if (nav.target === "art_studio") await navigate({ to: "/vytvarna-vychova" });\n        else if (nav.target === "special_education") await navigate({ to: "/specialni-pedagogika" });\n        else if (nav.target === "lesson" && nav.lessonId) await navigate({ to: "/hodina/$lessonId", params: { lessonId: nav.lessonId } });\n      }\n      if (!result.navigation) setVoiceNotice(result.requiresConfirmation ? "Navržená změna čeká na potvrzení." : "Hotovo.");\n    } catch (error) { setVoiceNotice(error instanceof Error ? error.message : "Hlasová asistentka zatím není připojena."); }\n    finally { setVoiceBusy(false); }\n  }\n'''
          s=once(s, marker, funcs, 'voice functions')
          old='''            <button\n              onClick={() => setListening(!listening)}\n              className={`mx-auto mt-8 grid h-28 w-28 place-items-center rounded-full text-white shadow-[0_18px_45px_rgba(39,103,101,.25)] transition ${listening ? "scale-105 bg-[#b85f61]" : "bg-[#276765] hover:scale-105"}`}\n            >\n              <Mic className="h-9 w-9" />\n            </button>\n            <p className="mt-4 text-center text-sm font-semibold text-[#53696a]">\n              {listening\n                ? "Mikrofon zatím není připojený — klepnutím zavři"\n                : "Klepni pro hlasové zadání"}\n            </p>\n            <div className="mt-6 rounded-2xl border border-dashed border-[#ddd8ce] bg-[#fcfbf8] p-4 text-xs leading-5 text-[#7b8989]">\n              <strong>AI a hlas zatím nejsou připojené.</strong> Reálný pracovní kontext už aplikace\n              sestavuje sama; až doplníme serverový API klíč, pošle se providerovi jen minimum\n              nutných dat.\n            </div>'''
          new='''            <button\n              onClick={() => void startGeneralVoice()}\n              disabled={voiceBusy}\n              className={`mx-auto mt-8 grid h-28 w-28 place-items-center rounded-full text-white shadow-[0_18px_45px_rgba(39,103,101,.25)] transition disabled:opacity-50 ${listening ? "scale-105 bg-[#b85f61]" : "bg-[#276765] hover:scale-105"}`}\n            >\n              {voiceBusy ? <Loader2 className="h-9 w-9 animate-spin" /> : listening ? <MicOff className="h-9 w-9" /> : <Mic className="h-9 w-9" />}\n            </button>\n            <p className="mt-4 text-center text-sm font-semibold text-[#53696a]">\n              {voiceBusy ? "Zpracovávám…" : listening ? "Mluv — klepnutím ukončíš" : "Klepni a mluv přirozeně"}\n            </p>\n            {(voiceTranscript || voiceReply || voiceNotice) && (\n              <div className="mt-6 space-y-3">\n                {voiceTranscript && <div className="rounded-2xl bg-[#f7f8f5] p-4"><div className="text-[11px] font-bold uppercase tracking-[.12em] text-[#82908f]">Ty</div><p className="mt-1 text-sm leading-6">{voiceTranscript}</p></div>}\n                {voiceReply && <div className="rounded-2xl bg-[#eaf6f0] p-4"><div className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-[.12em] text-[#4e7772]"><Volume2 className="h-3.5 w-3.5" /> Asistentka</div><p className="mt-1 text-sm leading-6">{voiceReply}</p></div>}\n                {proposedChange && <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4"><div className="text-xs font-bold text-amber-800">Návrh změny — zatím neprovedeno</div><p className="mt-1 text-sm text-amber-900">{proposedChange}</p><p className="mt-2 text-xs text-amber-700">Změny pedagogických dat se nikdy neprovedou jen hlasovým požadavkem bez výslovného potvrzení.</p></div>}\n                {voiceNotice && <p className="text-center text-xs text-[#7b8989]">{voiceNotice}</p>}\n              </div>\n            )}\n            <div className="mt-6 rounded-2xl border border-dashed border-[#ddd8ce] bg-[#fcfbf8] p-4 text-xs leading-5 text-[#7b8989]">\n              Push-to-talk: mikrofon běží jen po stisknutí. Zvuk se odešle k přepisu a po zpracování se neukládá. Asistentka dostává jen minimum pracovního kontextu a osobní paměť pouze tehdy, když je výslovně zapnutá.\n            </div>'''
          s=once(s, old, new, 'voice UI')
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/ai/contracts.ts src/lib/ai/provider.server.ts src/lib/ai/functions.ts src/routes/asistentka.tsx
      - run: bun run lint
      - run: bun run build
      - name: Commit
        run: |
          rm .github/workflows/companion-voice-control.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/contracts.ts src/lib/ai/provider.server.ts src/lib/ai/functions.ts src/routes/asistentka.tsx .github/workflows/companion-voice-control.yml
          git commit -m "feat: add general voice companion and safe app navigation"
          git push
