name: Apply Progress Moments
# retry: 2
on:
  push:
    paths:
      - '.github/workflows/apply-progress-moments.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Add shared deterministic evidence classifier
        run: |
          cat > src/lib/evidence-status.ts <<'EOF'
          import type { LearningSignalKind } from "@/lib/lesson-workspace-data";
          import type { ProgressReview } from "@/lib/special-education-data";

          export type EvidenceStatus = "insufficient" | "promising" | "mixed" | "attention";
          export type EvidenceEffect = "positive" | "neutral" | "attention";

          export function classifyEvidenceEffects(effects: EvidenceEffect[]): EvidenceStatus {
            if (effects.length < 2) return "insufficient";
            const recent = effects.slice(0, 4);
            const positiveCount = recent.filter((effect) => effect === "positive").length;
            const attentionCount = recent.filter((effect) => effect === "attention").length;
            if (positiveCount >= 2 && attentionCount === 0) return "promising";
            if (positiveCount > 0 && attentionCount > 0) return "mixed";
            if (attentionCount >= 2 && positiveCount === 0) return "attention";
            return "insufficient";
          }

          export function classifyLearningSignalEvidence(kinds: LearningSignalKind[]): EvidenceStatus {
            return classifyEvidenceEffects(
              kinds.map((kind) => {
                if (kind === "improving" || kind === "mastered" || kind === "advanced") return "positive";
                if (kind === "needs_practice" || kind === "follow_up") return "attention";
                return "neutral";
              }),
            );
          }

          export function classifySpecialProgressEvidence(
            levels: ProgressReview["change_level"][],
          ): EvidenceStatus {
            return classifyEvidenceEffects(
              levels.map((level) => {
                if (level === "slight_progress" || level === "clear_progress" || level === "goal_met")
                  return "positive";
                if (level === "worse") return "attention";
                return "neutral";
              }),
            );
          }

          export const evidenceStatusCopy: Record<EvidenceStatus, { label: string; detail: string }> = {
            insufficient: {
              label: "Zatím málo podkladů",
              detail: "Pro smysluplný trend je potřeba víc potvrzených pozorování.",
            },
            promising: {
              label: "Vypadá to nadějně",
              detail: "Více posledních potvrzených pozorování ukazuje příznivý směr.",
            },
            mixed: {
              label: "Výsledky jsou smíšené",
              detail: "Potvrzená pozorování se liší. Zatím je lepší pokračovat ve sledování.",
            },
            attention: {
              label: "Vyžaduje pozornost",
              detail: "Více posledních potvrzených pozorování ukazuje potřebu dalšího sledování nebo podpory.",
            },
          };
          EOF
      - name: Reuse shared classifier in contextual day
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/contextual-day-data.ts')
          s=p.read_text()
          s=s.replace('import type { LearningSignalKind } from "@/lib/lesson-workspace-data";','import type { LearningSignalKind } from "@/lib/lesson-workspace-data";\nimport { classifyLearningSignalEvidence, type EvidenceStatus } from "@/lib/evidence-status";')
          s=s.replace('export type EvidenceStatus = "insufficient" | "promising" | "mixed" | "attention";\n\n','')
          start=s.find('/**\n * Shared deterministic evidence status.')
          end=s.find('\nfunction lessonTiming', start)
          if start == -1 or end == -1: raise SystemExit('classifier block not found')
          s=s[:start]+s[end+1:]
          s=s.replace('const status = classifyConfirmedEvidence(group.slice(0, 4).map((signal) => signal.kind));','const status = classifyLearningSignalEvidence(group.slice(0, 4).map((signal) => signal.kind));')
          p.write_text(s)
          PY
      - name: Surface shared evidence status in special education
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/specialni-pedagogika.$caseId.tsx')
          s=p.read_text()
          imp='import { classifySpecialProgressEvidence, evidenceStatusCopy } from "@/lib/evidence-status";\n'
          anchor='import { VoiceObservationDraft } from "@/components/special-education/VoiceObservationDraft";\n'
          if imp not in s: s=s.replace(anchor, anchor+imp)
          marker='''  const activeAreas = catalog.filter((a) => activeCodes.has(a.code));\n\n  return ('''
          repl='''  const activeAreas = catalog.filter((a) => activeCodes.has(a.code));\n  const specialEvidenceStatus = classifySpecialProgressEvidence(\n    (workspace.reviews ?? []).map((review: any) => review.change_level),\n  );\n  const specialEvidenceCopy = evidenceStatusCopy[specialEvidenceStatus];\n\n  return ('''
          if marker not in s: raise SystemExit('active areas marker not found')
          s=s.replace(marker,repl,1)
          marker2='''            <ProgressReviewCard\n              areas={activeAreas}'''
          repl2='''            {specialEvidenceStatus !== "insufficient" && (\n              <div className="rounded-3xl border border-[#dce8e2] bg-[#f5faf7] p-4">\n                <div className="text-xs font-bold text-[#416f66]">{specialEvidenceCopy.label}</div>\n                <div className="mt-1 text-xs leading-5 text-[#74847f]">\n                  {specialEvidenceCopy.detail} Jde pouze o souhrn ručně potvrzených záznamů, ne o diagnózu ani AI úsudek.\n                </div>\n              </div>\n            )}\n            <ProgressReviewCard\n              areas={activeAreas}'''
          if marker2 not in s: raise SystemExit('progress card marker not found')
          s=s.replace(marker2,repl2,1)
          p.write_text(s)
          PY
      - name: Add progress moment to contextual day card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/ContextualDayLayer.tsx')
          s=p.read_text()
          s=s.replace('''  loadRecentUnfinishedPreparation,\n  type RecentDraft,''','''  loadProgressMoment,\n  loadRecentUnfinishedPreparation,\n  type ProgressMoment,\n  type RecentDraft,''')
          s=s.replace('''  const [recentDraft, setRecentDraft] = useState<RecentDraft | null>(null);''','''  const [recentDraft, setRecentDraft] = useState<RecentDraft | null>(null);\n  const [progressMoment, setProgressMoment] = useState<ProgressMoment | null>(null);''')
          old='''    void loadRecentUnfinishedPreparation(briefing.classInfo.id)\n      .then((draft) => {\n        if (active) setRecentDraft(draft);\n      })\n      .catch(() => {\n        if (active) setRecentDraft(null);\n      });'''
          new='''    void Promise.all([\n      loadRecentUnfinishedPreparation(briefing.classInfo.id).catch(() => null),\n      loadProgressMoment(briefing.classInfo.id).catch(() => null),\n    ]).then(([draft, moment]) => {\n      if (!active) return;\n      setRecentDraft(draft);\n      setProgressMoment(moment);\n    });'''
          if old not in s: raise SystemExit('effect marker not found')
          s=s.replace(old,new,1)
          old2='''        {recentDraft ? <ContinuationCard draft={recentDraft} now={now} /> : null}\n      </div>'''
          new2='''        {recentDraft ? <ContinuationCard draft={recentDraft} now={now} /> : null}\n        {progressMoment ? <ProgressMomentCard moment={progressMoment} /> : null}\n      </div>'''
          if old2 not in s: raise SystemExit('render marker not found')
          s=s.replace(old2,new2,1)
          append='''\n\nfunction ProgressMomentCard({ moment }: { moment: ProgressMoment }) {\n  const tone =\n    moment.status === "promising"\n      ? "border-[#d5e8db] bg-[#f3faf5]"\n      : moment.status === "mixed"\n        ? "border-[#eadfcf] bg-[#fffaf2]"\n        : "border-[#ead8d4] bg-[#fff7f5]";\n  return (\n    <div className={`rounded-[22px] border px-4 py-3.5 ${tone}`}>\n      <div className="flex items-start gap-3">\n        <div className="mt-0.5 text-lg" aria-hidden="true">\n          {moment.status === "promising" ? "🌱" : "○"}\n        </div>\n        <div>\n          <div className="text-sm font-bold text-[#3f5551]">{moment.title}</div>\n          <p className="mt-1 text-xs leading-5 text-[#778581]">{moment.detail}</p>\n        </div>\n      </div>\n    </div>\n  );\n}\n'''
          s=s+append
          p.write_text(s)
          PY
      - name: Add gentle preparation completion copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/hodina.$lessonId.tsx')
          s=p.read_text()
          old='''      await updateLessonStatus(lesson.id, "prepared");\n      setNotice("Příprava je bezpečně uložená.");'''
          new='''      await updateLessonStatus(lesson.id, "prepared");\n      const tomorrow = new Date();\n      tomorrow.setDate(tomorrow.getDate() + 1);\n      const tomorrowIso = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, "0")}-${String(tomorrow.getDate()).padStart(2, "0")}`;\n      setNotice(\n        lesson.lesson_date === tomorrowIso\n          ? "Připraveno na zítřek. ✓"\n          : "Příprava je hotová a bezpečně uložená. ✓",\n      );'''
          if old not in s: raise SystemExit('prep notice marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/lib/evidence-status.ts src/lib/contextual-day-data.ts src/components/ContextualDayLayer.tsx 'src/routes/specialni-pedagogika.$caseId.tsx' 'src/routes/hodina.$lessonId.tsx'
      - run: bun run lint
      - run: bun run build
      - name: Commit and remove runner
        run: |
          rm .github/workflows/apply-progress-moments.yml
          git config user.name "koem008"
          git config user.email "propertyboostmedia@gmail.com"
          git add src/lib/evidence-status.ts src/lib/contextual-day-data.ts src/components/ContextualDayLayer.tsx 'src/routes/specialni-pedagogika.$caseId.tsx' 'src/routes/hodina.$lessonId.tsx' .github/workflows/apply-progress-moments.yml
          git commit -m "feat: add shared deterministic progress moments"
          git push origin main
