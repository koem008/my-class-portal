name: Migration Reset

on:
  push:
    branches:
      - main
      - safety-curriculum-import
      - feature/e2e-lesson-workflow
  workflow_dispatch:

jobs:
  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database and apply all migrations from empty
        run: supabase db reset

      - name: Verify core tenant and class RLS boundaries
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/core_tenant_rls_adversarial.sql

      - name: Verify assistant coordinator RLS boundaries
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/assistant_coordinator_rls_adversarial.sql

      - name: Verify blocking calendar lesson reconciliation
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/calendar_blocking_reconciliation.sql

      - name: Verify confirmed lesson substitution
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/lesson_substitution_flow.sql

      - name: Show local Supabase status
        if: always()
        run: supabase status || true
