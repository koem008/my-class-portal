name: Migration Reset

on:
  push:
    branches:
      - safety-curriculum-import
      - feature/e2e-lesson-workflow
  workflow_dispatch:

jobs:
  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database and apply all migrations from empty
        run: supabase db reset

      - name: Show local Supabase status
        if: always()
        run: supabase status || true
