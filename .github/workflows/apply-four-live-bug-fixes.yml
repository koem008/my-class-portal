name: Apply four live bug fixes

on:
  push:
    branches:
      - fix/four-live-bugs

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/four-live-bugs
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted fixes
        run: python scripts/apply_four_live_bugs.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused tests
        run: bun test tests/companion-policy.test.ts tests/personal-companion-context.test.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix four live companion memory and navigation bugs"
          git push origin HEAD:fix/four-live-bugs
