name: Apply five live bug fixes

on:
  push:
    branches:
      - fix/four-live-bugs

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/four-live-bugs
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted fixes
        run: python scripts/apply_four_live_bugs.py

      - name: Align identity-context regression test
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/personal-companion-context.test.ts")
          text = path.read_text()
          old = '    expect(personalContextLines(context)).toEqual([]);'
          new = '    expect(personalContextLines(context)).toEqual(["Preferované oslovení uživatelky je „Káťo“."]);'
          if old not in text:
              raise SystemExit("Expected personal-context assertion not found")
          path.write_text(text.replace(old, new, 1))

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed code
        run: bunx prettier --write src/lib/ai/functions.ts src/lib/ai/companion-policy.ts src/lib/ai/provider.server.ts src/lib/personal-companion-context.ts src/components/GlobalVoiceCompanion.tsx src/components/SeasonalAmbience.tsx src/routes/__root.tsx src/routes/index.tsx src/routes/pamet.tsx src/lib/art-education-data.ts tests/companion-policy.test.ts tests/personal-companion-context.test.ts

      - name: Focused tests
        run: bun test tests/companion-policy.test.ts tests/personal-companion-context.test.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix five live companion memory navigation and art bugs"
          git push origin HEAD:fix/four-live-bugs
